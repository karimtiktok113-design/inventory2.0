<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management Pro — Small Business Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       DESIGN A: MODERN COLORFUL SAAS DESIGN SYSTEM & CSS VARIABLES
       ========================================================================== */
    :root {
      /* Base Theme: Midnight Blue (Default Modern SaaS) */
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --primary-glow: rgba(59, 130, 246, 0.35);

      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --info: #06b6d4;
      --info-light: #ecfeff;
      --purple: #8b5cf6;
      --purple-light: #f5f3ff;

      /* Workspace Surfaces (Light Mode) */
      --sidebar-bg: #0f172a;
      --sidebar-border: #1e293b;
      --sidebar-text: #94a3b8;
      --sidebar-text-active: #ffffff;
      --sidebar-item-hover: rgba(255, 255, 255, 0.06);

      --bg-workspace: #f8fafc;
      --header-bg: #ffffff;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;

      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --table-th-bg: #f8fafc;
      --table-hover-bg: #f1f5f9;
      --item-bg: #f8fafc;

      --card-radius: 16px;
      --btn-radius: 10px;
      --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      --card-hover-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1);
      --transition-base: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Mode Overrides */
    body.dark-mode {
      --bg-workspace: #090d16;
      --header-bg: #0f172a;
      --card-bg: #131d31;
      --border-color: #1e293b;
      --border-hover: #334155;

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;

      --input-bg: #1e293b;
      --input-border: #334155;
      --table-th-bg: #0f172a;
      --table-hover-bg: #1e293b;
      --item-bg: #0f172a;
      --primary-light: rgba(59, 130, 246, 0.15);
      --success-light: rgba(16, 185, 129, 0.15);
      --warning-light: rgba(245, 158, 11, 0.15);
      --danger-light: rgba(239, 68, 68, 0.15);
      --purple-light: rgba(139, 92, 246, 0.15);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    /* Color Scheme Themes */
    body.theme-royal-purple { --primary: #8b5cf6; --primary-hover: #7c3aed; --primary-light: #f5f3ff; --primary-glow: rgba(139,92,246,0.35); }
    body.theme-emerald { --primary: #10b981; --primary-hover: #059669; --primary-light: #ecfdf5; --primary-glow: rgba(16,185,129,0.35); }
    body.theme-ocean-blue { --primary: #0284c7; --primary-hover: #0369a1; --primary-light: #f0f9ff; --primary-glow: rgba(2,132,199,0.35); }
    body.theme-graphite { --primary: #4b5563; --primary-hover: #374151; --primary-light: #f3f4f6; --primary-glow: rgba(75,85,99,0.35); }
    body.theme-indigo { --primary: #6366f1; --primary-hover: #4f46e5; --primary-light: #eef2ff; --primary-glow: rgba(99,102,241,0.35); }
    body.theme-burgundy { --primary: #be123c; --primary-hover: #9f1239; --primary-light: #fff1f2; --primary-glow: rgba(190,18,60,0.35); }
    body.theme-teal { --primary: #0d9488; --primary-hover: #0f766e; --primary-light: #f0fdfa; --primary-glow: rgba(13,148,136,0.35); }
    body.theme-sunset { --primary: #ea580c; --primary-hover: #c2410c; --primary-light: #fff7ed; --primary-glow: rgba(234,88,12,0.35); }
    body.theme-rose { --primary: #e11d48; --primary-hover: #be123c; --primary-light: #fff1f2; --primary-glow: rgba(225,29,72,0.35); }

    /* Reset & Typography */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-workspace);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Layout Shell */
    .app-container {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* ==========================================================================
       SIDEBAR NAVIGATION (DARK NAVY MODERN SAAS)
       ========================================================================== */
    .sidebar {
      width: 270px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      transition: width 0.3s ease, transform 0.3s ease;
    }

    .sidebar-brand {
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: white;
      font-weight: 800;
      font-size: 18px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .brand-titles h1 {
      font-size: 15.5px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .brand-titles p {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .menu-group-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      padding: 12px 10px 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 9px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: var(--transition-base);
      position: relative;
    }

    .nav-btn:hover {
      color: var(--sidebar-text-active);
      background: var(--sidebar-item-hover);
    }

    .nav-btn.active {
      color: #ffffff;
      background: var(--primary);
      font-weight: 600;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .nav-btn .icon {
      font-size: 16px;
      width: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .nav-badge.danger {
      background: var(--danger);
      color: white;
      animation: pulseAlert 2s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.05); }
    }

    /* Fixed Bottom: About Developer */
    .sidebar-footer {
      padding: 14px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.25);
    }

    .about-dev-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      color: #f1f5f9;
      transition: var(--transition-base);
      width: 100%;
      text-align: left;
    }

    .about-dev-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .about-dev-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    /* ==========================================================================
       MAIN WORKSPACE & HEADER
       ========================================================================== */
    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
      background: var(--bg-workspace);
    }

    .top-header {
      height: 68px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 90;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      max-width: 520px;
    }

    .btn-menu-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 8px;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 18px;
    }

    .global-search-box {
      width: 100%;
      position: relative;
    }

    .search-icon-svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 14px;
    }

    .search-input-field {
      width: 100%;
      height: 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 0 44px 0 40px;
      font-size: 13px;
      color: var(--text-primary);
      font-family: inherit;
      transition: var(--transition-base);
    }

    .search-input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-shortcut {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--border-color);
      color: var(--text-secondary);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-btn {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      position: relative;
      transition: var(--transition-base);
    }

    .header-btn:hover {
      background: var(--table-hover-bg);
      color: var(--text-primary);
    }

    .header-badge-count {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card-bg);
    }

    .btn-quick-sale {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: var(--success);
      color: white;
      font-weight: 600;
      font-size: 13px;
      border-radius: var(--btn-radius);
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
      transition: var(--transition-base);
    }

    .btn-quick-sale:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    /* Content Area */
    .view-content {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }

    .view-header-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .page-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .action-button-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--btn-radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition-base);
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--card-bg);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      background: var(--table-hover-bg);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-warning {
      background: var(--warning);
      color: white;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 7px;
    }

    /* ==========================================================================
       KPI CARDS & SAAS METRIC TILES
       ========================================================================== */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 20px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-hover-shadow);
    }

    /* Colorful Top Accent Borders */
    .kpi-card.accent-blue { border-top: 4px solid var(--primary); }
    .kpi-card.accent-green { border-top: 4px solid var(--success); }
    .kpi-card.accent-purple { border-top: 4px solid var(--purple); }
    .kpi-card.accent-amber { border-top: 4px solid var(--warning); }
    .kpi-card.accent-red { border-top: 4px solid var(--danger); }
    .kpi-card.accent-cyan { border-top: 4px solid var(--info); }

    .kpi-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .kpi-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-icon-pill {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .kpi-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .kpi-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }

    .trend-badge {
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .trend-badge.up { color: var(--success); }
    .trend-badge.down { color: var(--danger); }
    .trend-badge.neutral { color: var(--text-muted); }

    /* ==========================================================================
       CARD PANELS, GRIDS, CHARTS & TABLES
       ========================================================================== */
    .grid-2-1 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .grid-1-1 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    .card.no-pad {
      padding: 0;
      overflow: hidden;
    }

    .card-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-header-bar.pad {
      padding: 20px 22px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--border-color);
    }

    .card-title-box h3 {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .card-title-box p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Filter Chips Bar */
    .filter-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--item-bg);
      border: 1px solid var(--border-color);
      padding: 3px;
      border-radius: 8px;
    }

    .pill-btn {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition-base);
    }

    .pill-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Floating Chart Tooltip */
    .chart-tooltip {
      position: fixed;
      display: none;
      pointer-events: none;
      z-index: 10000;
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.5;
      min-width: 170px;
      transform: translate(-50%, -115%);
      transition: opacity 0.12s ease;
    }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .data-table th {
      padding: 12px 16px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      background: var(--table-th-bg);
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .data-table td {
      padding: 13px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tr:hover td {
      background: var(--table-hover-bg);
      color: var(--text-primary);
    }

    .prod-info-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .prod-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--item-bg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .prod-title {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 13.5px;
    }

    .prod-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Stock Status Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .badge-in-stock { background: var(--success-light); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .badge-low-stock { background: var(--warning-light); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
    .badge-out-of-stock { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    .badge-info { background: var(--info-light); color: var(--info); border: 1px solid rgba(6,182,212,0.3); }
    .badge-purple { background: var(--purple-light); color: var(--purple); border: 1px solid rgba(139,92,246,0.3); }

    /* Progress Meters */
    .meter-bar {
      width: 80px;
      height: 6px;
      background: var(--border-color);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    .meter-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* Empty States */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
    }
    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 4px;
    }
    .empty-state h4 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .empty-state p {
      font-size: 13px;
      max-width: 380px;
    }

    /* ==========================================================================
       POS TERMINAL / NEW SALE STYLES
       ========================================================================== */
    .pos-container {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      min-height: calc(100vh - 180px);
    }

    .pos-catalog-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pos-search-bar {
      display: flex;
      gap: 10px;
    }

    .pos-category-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .pos-products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      overflow-y: auto;
      max-height: calc(100vh - 280px);
      padding-right: 4px;
    }

    .pos-item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: var(--transition-base);
    }

    .pos-item-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--card-hover-shadow);
    }

    .pos-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pos-item-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .pos-item-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    /* POS Cart Panel */
    .pos-cart-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 90px;
      height: calc(100vh - 120px);
    }

    .pos-cart-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pos-cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--item-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      gap: 10px;
    }

    .cart-row-info {
      flex: 1;
      min-width: 0;
    }

    .cart-row-title {
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-row-price {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }

    .qty-val {
      font-size: 13px;
      font-weight: 700;
      width: 24px;
      text-align: center;
    }

    .pos-cart-totals {
      padding: 18px 20px;
      border-top: 1px solid var(--border-color);
      background: var(--item-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .totals-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .totals-line.grand {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
    }

    /* ==========================================================================
       MODALS & DIALOG DRAWERS
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      transform: scale(0.95);
      transition: transform 0.2s ease;
      overflow: hidden;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card.modal-lg { max-width: 860px; }
    .modal-card.modal-sm { max-width: 440px; }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }
    .modal-close-btn:hover { color: var(--text-primary); }

    .modal-body {
      padding: 22px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: var(--item-bg);
    }

    /* Forms */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-primary);
      font-family: inherit;
      transition: var(--transition-base);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Toast Notification System */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: #0f172a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 4px solid var(--primary);
      animation: slideToast 0.3s ease forwards;
      max-width: 360px;
    }

    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast.warning { border-color: var(--warning); }

    @keyframes slideToast {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ==========================================================================
       INFOGRAPHIC & PRINT EXPORT STYLES (A4 & RESPONSIVE PDF)
       ========================================================================== */
    .modal-card.modal-xl { max-width: 960px; }

    /* Infographic Document Layouts */
    .doc-paper {
      background: white;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 16px;
      line-height: 1.5;
    }
    
    .doc-header-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
      flex-wrap: wrap;
    }

    .doc-brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-meta-card {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .doc-type-pill {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }

    .doc-num-hero {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
    }

    /* Infographic 4-KPI Grid */
    .doc-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 4px 0;
    }

    @media (max-width: 768px) {
      .doc-kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .doc-kpi-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: relative;
      overflow: hidden;
    }

    .doc-kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: #cbd5e1;
    }
    .doc-kpi-card.primary::before { background: #3b82f6; }
    .doc-kpi-card.success::before { background: #10b981; }
    .doc-kpi-card.warning::before { background: #f59e0b; }
    .doc-kpi-card.danger::before { background: #ef4444; }
    .doc-kpi-card.purple::before { background: #8b5cf6; }

    .doc-kpi-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
    }

    .doc-kpi-val {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      font-family: 'JetBrains Mono', monospace;
    }

    .doc-kpi-sub {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    /* Visual Infographic Progress Bar / Meter */
    .doc-meter-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-meter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      flex-wrap: wrap;
      gap: 6px;
    }

    .doc-meter-track {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }

    .doc-meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Infographic Split Bar for Revenue Allocation */
    .doc-split-bar {
      height: 14px;
      background: #e2e8f0;
      border-radius: 7px;
      overflow: hidden;
      display: flex;
      width: 100%;
    }

    .doc-split-seg {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: white;
    }

    /* Infographic Table */
    .doc-table-wrap {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .doc-table thead tr {
      background: #0f172a;
      color: #f8fafc;
    }

    .doc-table thead th {
      padding: 10px 14px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .doc-table tbody tr {
      border-bottom: 1px solid #f1f5f9;
    }

    .doc-table tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    .doc-table tbody td {
      padding: 9px 14px;
      color: #1e293b;
    }

    .doc-table tfoot tr {
      background: #f1f5f9;
      font-weight: 800;
      border-top: 2px solid #cbd5e1;
    }

    .doc-table tfoot td {
      padding: 10px 14px;
    }

    /* Verification Badge & Barcode Simulation */
    .doc-security-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      gap: 16px;
      flex-wrap: wrap;
    }

    .doc-verified-seal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      color: #059669;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 5px 10px;
      border-radius: 6px;
      letter-spacing: 0.03em;
    }

    .doc-barcode {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 26px;
      padding: 0 4px;
    }

    .doc-barcode-bar {
      height: 100%;
      background: #0f172a;
      display: inline-block;
    }

    /* ==========================================================================
       MINIMALIST PREMIUM INVOICE STYLES
       ========================================================================== */
    .invoice-minimal-wrap {
      background: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 28px 32px;
      line-height: 1.5;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
      max-width: 860px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .inv-min-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 20px;
    }
    .inv-min-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }
    .inv-min-meta {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    .inv-min-rule {
      height: 1px;
      background: #e2e8f0;
      margin: 20px 0;
      border: none;
    }
    .inv-min-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-bottom: 24px;
    }
    @media screen and (max-width: 640px) {
      .inv-min-header {
        flex-wrap: wrap;
      }
      .inv-min-grid-2 {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .inv-min-meta {
        text-align: left;
        align-items: flex-start;
      }
    }
    .inv-min-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .inv-min-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-bottom: 24px;
    }
    .inv-min-table thead th {
      border-top: 1px solid #0f172a;
      border-bottom: 1px solid #0f172a;
      padding: 10px 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0f172a;
      text-align: left;
    }
    .inv-min-table tbody td {
      border-bottom: 1px solid #f1f5f9;
      padding: 12px 8px;
      color: #1e293b;
    }
    .inv-min-totals {
      margin-left: auto;
      width: 290px;

      flex-direction: column;

    }
    .inv-min-totals-row {
      display: flex;
      justify-content: space-between;
      color: #475569;
    }
    .inv-min-totals-grand {
      border-top: 1px solid #0f172a;
      padding-top: 8px;
      margin-top: 4px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    /* ==========================================================================
       POS THERMAL PRINTER GROCERY RECEIPT STYLES
       ========================================================================== */
    .invoice-thermal-wrap {
      max-width: 380px;
      margin: 0 auto;
      background: #ffffff;
      color: #0f172a;
      font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      padding: 24px 20px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }
    .thermal-center {
      text-align: center;
    }
    .thermal-divider-dashed {
      border-bottom: 1px dashed #64748b;
      margin: 10px 0;
    }
    .thermal-divider-solid {
      border-bottom: 1px solid #0f172a;
      margin: 10px 0;
    }
    .thermal-divider-double {
      border-bottom: 2px solid #0f172a;
      margin: 10px 0;
    }
    .thermal-table {
      width: 100%;
      border-collapse: collapse;
      font-family: inherit;
      font-size: inherit;
    }
    .thermal-table th, .thermal-table td {
      padding: 3px 0;
    }
    .thermal-barcode-bars {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 30px;
      margin: 6px 0;
    }
    .thermal-bar {
      height: 100%;
      background: #0f172a;
      display: inline-block;
    }

    /* A4 Print Engine */
    @page {
      size: A4 portrait;
      margin: 10mm 10mm 10mm 10mm;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      /* Cleanly hide UI chrome */
      .sidebar, .top-header, .btn, .header-right, .filter-pills, .action-button-row,
      .top-concept-bar, .modal-close-btn, .modal-footer, .no-print, #revProfitsTooltip,
      .toast-container, .modal-header, .chart-tooltip, #globalSearchResults, .btn-menu-toggle,
      .mobile-bottom-nav, .sidebar-backdrop {
        display: none !important;
      }

      /* Hide background workspace when printing an active modal */
      body.modal-open .main-workspace,
      body:has(#activeModalOverlay) .main-workspace {
        display: none !important;
      }

      body, .main-workspace, .app-container {
        background: white !important;
        color: #0f172a !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }

      .modal-overlay {
        position: static !important;
        display: block !important;
        background: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      .modal-card {
        position: static !important;
        width: 100% !important;
        max-width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        transform: none !important;
        background: white !important;
        color: #0f172a !important;
      }

      .modal-body {
        padding: 0 !important;
        overflow: visible !important;
        max-height: none !important;
        display: block !important;
      }

      .doc-paper {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }

      .pnl-statement-container {
        max-width: 100% !important;
        width: 100% !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /* Avoid awkward breaks inside elements */
      .doc-kpi-grid, .doc-kpi-card, .doc-meter-box, .doc-table-wrap,
      tr, .doc-security-strip, .doc-split-bar, .infographic-footer-block,
      .invoice-minimal-wrap, .invoice-thermal-wrap {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      .doc-kpi-grid {
        grid-template-columns: repeat(4, 1fr) !important;
      }

      .invoice-print-area {
        display: block !important;
        width: 100% !important;
      }

      /* ==========================================================================
         EXCLUSIVE ACTIVE TEMPLATE PRINT FILTER & EXACT PREVIEW REPLICATION
         Only the currently active or selected design is printed / exported to PDF!
         Replicates 100% of the visual layout, dimensions, borders, and typography of the preview.
         ========================================================================== */
      
      /* Case A: POS Thermal Receipt is Active */
      body.print-thermal-receipt #invoiceDesignMinimal {
        display: none !important;
      }
      body.print-thermal-receipt #invoiceDesignThermal {
        display: block !important;
        width: 380px !important;
        max-width: 380px !important;

  <script>
    /* ==========================================================================
       1. DATABASE & STORAGE LAYER (INDEXEDDB + LOCALSTORAGE)
       ========================================================================== */
    const DB_NAME = 'InventoryProDB';
    const DB_VERSION = 3;
    let db = null;

    // Database initialization with automatic migration & fallback support
    async function initDB() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            const stores = [
              'products', 'categories', 'brands', 'stock_movements',
              'sales', 'purchases', 'customers', 'suppliers',
              'invoices', 'payments', 'expenses', 'settings'
            ];
            stores.forEach(store => {
              if (!d.objectStoreNames.contains(store)) {
                d.createObjectStore(store, { keyPath: 'id' });
              }
            });
          };
          req.onsuccess = (e) => {
            db = e.target.result;
            resolve(db);
          };
          req.onerror = (e) => {
            console.warn('IndexedDB failed to open, falling back to localStorage', e);
            resolve(null);
          };
        } catch(err) {
          console.warn('IndexedDB exception, using localStorage fallback', err);
          resolve(null);
        }
      });
    }

    // Generic DB Helpers with LocalStorage Dual-Persistence & Store Verification
    async function dbGetAll(storeName) {
      if (!db || !db.objectStoreNames.contains(storeName)) {
        try {
          const raw = localStorage.getItem(`imp_${storeName}`);
          return raw ? JSON.parse(raw) : [];
        } catch(e) { return []; }
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => {
            if (req.result && req.result.length > 0) {
              resolve(req.result);
            } else {
              try {
                const raw = localStorage.getItem(`imp_${storeName}`);
                resolve(raw ? JSON.parse(raw) : []);
              } catch(e) { resolve([]); }
            }
          };
          req.onerror = () => {
            try {
              const raw = localStorage.getItem(`imp_${storeName}`);
              resolve(raw ? JSON.parse(raw) : []);
            } catch(e) { resolve([]); }
          };
        } catch(e) {
          try {
            const raw = localStorage.getItem(`imp_${storeName}`);
            resolve(raw ? JSON.parse(raw) : []);
          } catch(err) { resolve([]); }
        }
      });
    }

    async function dbPut(storeName, item) {
      // 1. Instant synchronous write to localStorage
      try {
        const raw = localStorage.getItem(`imp_${storeName}`);
        let all = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(all)) all = [];
        const idx = all.findIndex(x => x && x.id === item.id);
        if (idx >= 0) all[idx] = item;
        else all.push(item);
        localStorage.setItem(`imp_${storeName}`, JSON.stringify(all));
      } catch (e) {
        console.warn('localStorage sync warning:', e);
      }

      // 2. Write to IndexedDB if store exists
      if (!db || !db.objectStoreNames.contains(storeName)) {
        return item;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(item);
          req.onsuccess = () => resolve(item);
          req.onerror = () => resolve(item);
        } catch(e) {
          console.warn('IDB put error, preserved in localStorage:', e);
          resolve(item);
        }
      });
    }

    async function dbDelete(storeName, id) {
      try {
        const raw = localStorage.getItem(`imp_${storeName}`);
        let all = raw ? JSON.parse(raw) : [];
        if (Array.isArray(all)) {
          all = all.filter(x => x && x.id !== id);
          localStorage.setItem(`imp_${storeName}`, JSON.stringify(all));
        }
      } catch(e) {}

      if (!db || !db.objectStoreNames.contains(storeName)) {
        return true;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          store.delete(id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(true);
        } catch(e) {
          resolve(true);
        }
      });
    }

    async function dbClear(storeName) {
      try {
        localStorage.removeItem(`imp_${storeName}`);
      } catch(e) {}

      if (!db || !db.objectStoreNames.contains(storeName)) {
        return true;
      }
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          store.clear();
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(true);
        } catch(e) {
          resolve(true);
        }
      });
    }

    /* ==========================================================================
       4. STATE SYNCHRONIZATION & SETTINGS MANAGER
       ========================================================================== */
    async function loadStateFromDB() {
      // 1. First load from localStorage (instant synchronous availability)
      try {
        const localSettings = localStorage.getItem('imp_settings');
        if (localSettings) {
          const parsed = JSON.parse(localSettings);
          if (parsed && typeof parsed === 'object') {
            State.settings = { ...State.settings, ...parsed };
          }
        }
      } catch(e) {}

      // 2. Also check IndexedDB and merge if available
      try {
        const savedSettings = await dbGetAll('settings');
        if (savedSettings && savedSettings.length > 0) {
          const found = savedSettings.find(s => s.id === 'app_settings') || savedSettings[0];
          State.settings = { ...State.settings, ...found };
        }
      } catch(e) {}

      // Load saved date range (synchronized across Dashboard & Revenue & Profits)
      try {
        const savedRange = localStorage.getItem('imp_dashboard_date_range');
        if (savedRange) {
          State.dashboardDateRange = savedRange;
          if (State.revenueProfits) State.revenueProfits.dateRange = savedRange;
        }
      } catch(e) {}

      try {
        const savedRP = localStorage.getItem('imp_rev_profits_settings');
        if (savedRP) {
          const parsedRP = JSON.parse(savedRP);
          if (parsedRP && typeof parsedRP === 'object') {
            State.revenueProfits = { ...State.revenueProfits, ...parsedRP };
            if (parsedRP.dateRange) State.dashboardDateRange = parsedRP.dateRange;
          }
        }
      } catch(e) {}

      // Synchronize loaded settings to the entire UI
      syncSettingsToUI();

      State.products = await dbGetAll('products');
      State.categories = await dbGetAll('categories');
      State.brands = await dbGetAll('brands');
      State.stockMovements = await dbGetAll('stock_movements');
      State.sales = await dbGetAll('sales');
      State.purchases = await dbGetAll('purchases');
      State.customers = await dbGetAll('customers');
      State.suppliers = await dbGetAll('suppliers');
      State.invoices = await dbGetAll('invoices');
      State.payments = await dbGetAll('payments');
      State.expenses = await dbGetAll('expenses');

      // Update badge counts in sidebar
      const lowStockCount = State.products.filter(p => p.stock <= p.reorderLevel).length;
      document.getElementById('badgeProducts').innerText = State.products.length;
      document.getElementById('badgeLowStock').innerText = lowStockCount;
      document.getElementById('headerNotifBadge').innerText = lowStockCount;
    }

    function syncSettingsToUI() {
      // 1. Sidebar Brand Name & Browser Tab Title
      const bizNameEl = document.getElementById('sidebarBizName');
      if (bizNameEl) bizNameEl.innerText = State.settings.businessName || 'Inventory Pro';
      document.title = `${State.settings.businessName || 'Inventory Pro'} — Small Business Suite`;

      // 2. Active Visual Theme Palette
      document.body.className = document.body.className
        .split(' ')
        .filter(c => !c.startsWith('theme-'))
        .join(' ');
      if (State.settings.theme && State.settings.theme !== 'midnight') {
        document.body.classList.add(`theme-${State.settings.theme}`);
      }

      // 3. Dark Mode
      if (State.settings.darkMode) {
        document.body.classList.add('dark-mode');

        if (icon) icon.innerText = '☀️';
      } else {
        document.body.classList.remove('dark-mode');
        const icon = document.getElementById('headerDarkIcon');
        if (icon) icon.innerText = '🌙';
      }
    }

    /* ==========================================================================
       6. CENTRALIZED BUSINESS CALCULATIONS
       ========================================================================== */
    function getDateRangeBounds(range, customStart, customEnd) {
      const now = new Date();
      let start = new Date(0);
      let end = new Date();
      let prevStart = new Date(0);
      let prevEnd = new Date(0);
      let isBounded = true;

      const r = (range || '30D').trim();

      if (r === 'Today') {
        start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        prevStart = new Date(start.getTime() - 86400000);
        prevEnd = new Date(end.getTime() - 86400000);
      } else if (r === 'Yesterday') {
        start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1, 0, 0, 0, 0);
        end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1, 23, 59, 59, 999);
        prevStart = new Date(start.getTime() - 86400000);
        prevEnd = new Date(end.getTime() - 86400000);
      } else if (r === '7D' || r === 'Last 7 Days') {
        end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        start = new Date(end.getTime() - (7 * 86400000) + 1);
        prevEnd = new Date(start.getTime() - 1);
        prevStart = new Date(prevEnd.getTime() - (7 * 86400000) + 1);
      } else if (r === '30D' || r === 'Last 30 Days') {
        end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        start = new Date(end.getTime() - (30 * 86400000) + 1);
        prevEnd = new Date(start.getTime() - 1);
        prevStart = new Date(prevEnd.getTime() - (30 * 86400000) + 1);
      } else if (r === 'This Month') {
        start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
        end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
        prevStart = new Date(now.getFullYear(), now.getMonth() - 1, 1, 0, 0, 0, 0);
        prevEnd = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999);
      } else if (r === 'Last Month') {
        start = new Date(now.getFullYear(), now.getMonth() - 1, 1, 0, 0, 0, 0);
        end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999);
        prevStart = new Date(now.getFullYear(), now.getMonth() - 2, 1, 0, 0, 0, 0);
        prevEnd = new Date(now.getFullYear(), now.getMonth() - 1, 0, 23, 59, 59, 999);
      } else if (r === 'This Quarter') {
        const q = Math.floor(now.getMonth() / 3);
        start = new Date(now.getFullYear(), q * 3, 1, 0, 0, 0, 0);
        end = new Date(now.getFullYear(), (q + 1) * 3, 0, 23, 59, 59, 999);
        prevStart = new Date(now.getFullYear(), (q - 1) * 3, 1, 0, 0, 0, 0);
        prevEnd = new Date(now.getFullYear(), q * 3, 0, 23, 59, 59, 999);
      } else if (r === 'This Year') {
        start = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
        end = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
        prevStart = new Date(now.getFullYear() - 1, 0, 1, 0, 0, 0, 0);
        prevEnd = new Date(now.getFullYear() - 1, 11, 31, 23, 59, 59, 999);
      } else if (r === 'Last Year') {
        start = new Date(now.getFullYear() - 1, 0, 1, 0, 0, 0, 0);
        end = new Date(now.getFullYear() - 1, 11, 31, 23, 59, 59, 999);
        prevStart = new Date(now.getFullYear() - 2, 0, 1, 0, 0, 0, 0);
        prevEnd = new Date(now.getFullYear() - 2, 11, 31, 23, 59, 59, 999);
      } else if (r === 'Custom' && customStart && customEnd) {
        start = new Date(customStart + 'T00:00:00');
        end = new Date(customEnd + 'T23:59:59.999');
        const span = end.getTime() - start.getTime();
        prevEnd = new Date(start.getTime() - 1);
        prevStart = new Date(prevEnd.getTime() - span);
      } else {
        // All Time
        isBounded = false;
        start = new Date(0);
        end = new Date(now.getFullYear() + 10, 11, 31, 23, 59, 59, 999);
        prevStart = new Date(0);
        prevEnd = new Date(0);
      }

      return { range: r, start, end, prevStart, prevEnd, isBounded };
    }

    function isDateInRange(dateStr, range, customStart, customEnd) {
      if (!range || range === 'all' || range === 'All Time') return true;
      if (!dateStr) return false;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return false;
      const bounds = getDateRangeBounds(range, customStart, customEnd);
      if (!bounds.isBounded) return true;
      const t = d.getTime();
      return t >= bounds.start.getTime() && t <= bounds.end.getTime();
    }

    /* Primary Unified Financial Calculation Engine (Synchronized across the entire application) */
    function calculateFinancials(dateRange = (State.dashboardDateRange || '30D'), customStart, customEnd, filters = {}) {
      const bounds = getDateRangeBounds(dateRange, customStart, customEnd);

      const filteredSales = State.sales.filter(s => {
        if (!s || !s.date) return false;
        const t = new Date(s.date).getTime();
        if (bounds.isBounded && (t < bounds.start.getTime() || t > bounds.end.getTime())) return false;

        if (filters.paymentStatus && filters.paymentStatus !== 'all') {
          if (s.status !== filters.paymentStatus) return false;
        }
        if (filters.salesStatus && filters.salesStatus !== 'all') {
          if (filters.salesStatus === 'Completed' && s.status === 'Returned') return false;
          if (filters.salesStatus === 'Returned' && s.status !== 'Returned') return false;
        }
        if (filters.selectedCustomer && filters.selectedCustomer !== 'all') {
          if (s.customerId !== filters.selectedCustomer && s.customerName !== filters.selectedCustomer) return false;
        }
        if (filters.selectedProduct && filters.selectedProduct !== 'all') {
          const hasProd = (s.items || []).some(it => it.productId === filters.selectedProduct || it.name === filters.selectedProduct);
          if (!hasProd) return false;
        }
        if (filters.selectedCategory && filters.selectedCategory !== 'all') {
          const hasCat = (s.items || []).some(it => {
            const prod = State.products.find(p => p.id === it.productId || p.name === it.name);
            return prod && prod.category === filters.selectedCategory;
          });
          if (!hasCat) return false;
        }

        return true;
      });

      const filteredExpenses = State.expenses.filter(e => {
        if (!e || !e.date) return false;
        const t = new Date(e.date).getTime();
        if (bounds.isBounded && (t < bounds.start.getTime() || t > bounds.end.getTime())) return false;
        return true;
      });

      const filteredPurchases = State.purchases.filter(p => {
        if (!p || !p.date) return false;
        const t = new Date(p.date).getTime();
        if (bounds.isBounded && (t < bounds.start.getTime() || t > bounds.end.getTime())) return false;
        return true;
      });

      let grossSales = 0;
      let returnsTotal = 0;
      let returnsCount = 0;
      let qualifyingCount = 0;
      let totalCOGS = 0;
      let totalDiscount = 0;
      let totalUnits = 0;

      filteredSales.forEach(s => {
        const total = Number(s.total || 0);
        const discount = Number(s.discount || 0);
        const cogs = Number(s.cogs || 0);
        const units = (s.items || []).reduce((acc, it) => acc + (Number(it.qty) || 0), 0);

        totalDiscount += discount;
        totalUnits += units;

        if (s.status === 'Returned') {
          returnsTotal += total;
          returnsCount++;
        } else {
          grossSales += total;
          totalCOGS += cogs;
          qualifyingCount++;
        }
      });

      const netRevenue = grossSales;
      const grossProfit = netRevenue - totalCOGS;
      const totalExpenses = filteredExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
      const netProfit = grossProfit - totalExpenses;
      const grossMargin = netRevenue > 0 ? (grossProfit / netRevenue) * 100 : 0;
      const netMargin = netRevenue > 0 ? (netProfit / netRevenue) * 100 : 0;
      const avgOrderValue = qualifyingCount > 0 ? netRevenue / qualifyingCount : 0;

      const totalReceivables = filteredSales.filter(s => s.status !== 'Returned').reduce((sum, s) => sum + (Number(s.balance) || 0), 0);
      const totalPayables = filteredPurchases.reduce((sum, p) => sum + (Number(p.balance) || 0), 0);

      const inventoryCostValue = State.products.reduce((sum, p) => sum + ((Number(p.stock) || 0) * (Number(p.cost) || 0)), 0);
      const potentialRetailValue = State.products.reduce((sum, p) => sum + ((Number(p.stock) || 0) * (Number(p.price) || 0)), 0);
      const potentialGrossProfit = potentialRetailValue - inventoryCostValue;
      const lowStockItems = State.products.filter(p => p.stock > 0 && p.stock <= p.reorderLevel);
      const outOfStockItems = State.products.filter(p => p.stock <= 0);

      return {
        dateRange: bounds.range,
        bounds,
        totalRevenue: netRevenue,
        netRevenue: netRevenue,
        grossSales,
        returnsTotal,
        returnsCount,
        totalCOGS,
        cogs: totalCOGS,
        grossProfit,
        totalExpenses,
        netProfit,
        grossMargin,
        netMargin,
        totalSalesCount: qualifyingCount,
        qualifyingCount,
        allSalesCount: filteredSales.length,
        totalUnits,
        avgOrderValue,
        totalDiscount,
        totalReceivables,
        totalPayables,
        inventoryCostValue,
        potentialRetailValue,
        potentialGrossProfit,
        lowStockItems,
        outOfStockItems,
        totalProducts: State.products.length,
        unitsInStock: State.products.reduce((sum, p) => sum + (Number(p.stock) || 0), 0),
        totalCustomers: State.customers.length,
        totalSuppliers: State.suppliers.length,
        filteredSales,
        filteredExpenses,
        filteredPurchases
      };
    }

    function filterDashboardSalesTable() {
      const q = (document.getElementById('dashSalesSearch')?.value || '').toLowerCase().trim();
      const status = document.getElementById('dashSalesStatusFilter')?.value || 'all';
      const activeRange = State.dashboardDateRange || '30D';

      let list = getSortedSales().filter(s => isDateInRange(s.date, activeRange));

      if (q) {
        list = list.filter(s =>
          (s.id && s.id.toLowerCase().includes(q)) ||
          (s.invoiceNumber && s.invoiceNumber.toLowerCase().includes(q)) ||
          (s.customerName && s.customerName.toLowerCase().includes(q)) ||
          (s.customerBusiness && s.customerBusiness.toLowerCase().includes(q)) ||
          (s.paymentMethod && s.paymentMethod.toLowerCase().includes(q))
        );
      }

      if (status !== 'all') {
        list = list.filter(s => s.status === status);
      }

      const badge = document.getElementById('dashSalesCountBadge');
      if (badge) badge.innerText = `${list.length} Transactions (${activeRange})`;

      const tbody = document.querySelector('#dashboardSalesTable tbody');
      if (tbody) tbody.innerHTML = renderDashboardSalesRows(list.slice(0, 10));
    }

    function renderDashboardView() {
      const activeRange = State.dashboardDateRange || '30D';
      const f = calculateFinancials(activeRange);
      const dashboardSales = getSortedSales().filter(s => isDateInRange(s.date, activeRange));
      const is7D = activeRange === '7D' || activeRange === 'Last 7 Days';
      const is30D = activeRange === '30D' || activeRange === 'Last 30 Days';

      const chartPeriodLabels = is7D 
        ? `<span>Day 1-2</span><span>Day 3-4</span><span>Day 5-6</span><span>Day 7 (Today)</span>`
        : activeRange === 'This Year'
        ? `<span>Q1</span><span>Q2</span><span>Q3</span><span>Q4 (Current)</span>`
        : activeRange === 'All Time'
        ? `<span>Earlier</span><span>Past Months</span><span>Recent</span><span>Current</span>`
        : `<span>Week 1</span><span>Week 2</span><span>Week 3</span><span>Week 4 (Current)</span>`;

    function renderProductsTableRows(prods) {
      if (prods.length === 0) {
        return `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">📦</div><h4>No Products Found</h4><p>Try adjusting your search query or filters.</p><button class="btn btn-primary btn-sm" onclick="openAddProductModal()">Add Product</button></div></td></tr>`;
      }
      return prods.map(p => {
        let statusBadge = `<span class="badge badge-in-stock">🟢 In Stock</span>`;
        let barColor = 'var(--success)';
        let fillPct = Math.min(100, Math.round((p.stock / (p.reorderLevel * 2 || 20)) * 100));

        if (p.stock <= 0) {
          statusBadge = `<span class="badge badge-out-of-stock">🔴 Out of Stock</span>`;
          barColor = 'var(--danger)';
          fillPct = 0;
        } else if (p.stock <= p.reorderLevel) {
          statusBadge = `<span class="badge badge-low-stock">🟡 Low Stock</span>`;
          barColor = 'var(--warning)';
        }

        return `
          <tr>
            <td>
              <div class="prod-info-cell">
                <div class="prod-avatar">${p.emoji || '📦'}</div>
                <div>
                  <div class="prod-title">${p.name}</div>
                  <div class="prod-sub">SKU: ${p.sku} • Unit: ${p.unit || 'Piece'}</div>
                </div>
              </div>
            </td>
            <td><span class="badge badge-info">${p.category || 'General'}</span></td>
            <td style="font-weight:600;">${formatMoney(p.cost)}</td>
            <td style="font-weight:700; color:var(--primary);">${formatMoney(p.price)}</td>
            <td>
              <div class="meter-bar"><div class="meter-fill" style="width:${fillPct}%; background:${barColor};"></div></div>
              <span style="font-weight:700; color:var(--text-primary);">${p.stock}</span>
            </td>
            <td style="font-weight:700; color:var(--text-primary);">${formatMoney(p.stock * p.cost)}</td>
            <td>${statusBadge}</td>
            <td style="text-align:right;">
              <div style="display:inline-flex; gap:6px;">
                <button class="btn btn-secondary btn-sm" title="Edit Product" onclick="openEditProductModal('${p.id}')">✏️</button>
                <button class="btn btn-secondary btn-sm" title="Adjust Stock" onclick="openStockAdjustModal('${p.id}')">⚡</button>
                <button class="btn btn-secondary btn-sm" title="Delete Product" style="color:var(--danger);" onclick="deleteProduct('${p.id}')">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterProductsTable() {
      const q = (document.getElementById('prodTableSearch')?.value || '').toLowerCase();
      const cat = document.getElementById('prodCategoryFilter')?.value || '';
      const stock = document.getElementById('prodStockFilter')?.value || '';
      const sortBy = document.getElementById('prodSortFilter')?.value || 'newest';

      let filtered = State.products.filter(p => {
        const matchesQ = p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.barcode || '').includes(q);
        const matchesCat = !cat || p.category === cat;
        let matchesStock = true;
        if (stock === 'in_stock') matchesStock = p.stock > p.reorderLevel;
        if (stock === 'low_stock') matchesStock = p.stock > 0 && p.stock <= p.reorderLevel;
        if (stock === 'out_of_stock') matchesStock = p.stock <= 0;
        return matchesQ && matchesCat && matchesStock;
      });

      if (sortBy === 'newest') {
        filtered = filtered.reverse();
      } else if (sortBy === 'price_desc') {
        filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
      } else if (sortBy === 'price_asc') {
        filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
      } else if (sortBy === 'stock_asc') {
        filtered.sort((a, b) => (a.stock || 0) - (b.stock || 0));
      } else if (sortBy === 'name_asc') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      }

      const tbody = document.querySelector('#productsMasterTable tbody');
      if (tbody) tbody.innerHTML = renderProductsTableRows(filtered);
    }

    function renderPOSProductCards(prods) {
      if (prods.length === 0) {

      return prods.map(p => `

    function filterPOSProducts() {
      const q = (document.getElementById('posSearchInput')?.value || '').toLowerCase();
      const filtered = State.products.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.barcode || '').includes(q));

    function filterPOSCategory(cat) {
      document.querySelectorAll('.pos-category-chips .pill-btn').forEach(b => b.classList.remove('active'));
      event?.target?.classList.add('active');
      const filtered = cat ? State.products.filter(p => p.category === cat) : State.products;
      const grid = document.getElementById('posProductsGrid');
      if (grid) grid.innerHTML = renderPOSProductCards(filtered);
    }

    function addToCart(productId) {
      const prod = State.products.find(p => p.id === productId);
      if (!prod) return;

      if (prod.stock <= 0 && !State.settings.allowNegativeStock) {
        showToast(`Cannot sell ${prod.name}: Out of Stock!`, 'error');
        return;
      }

      const existing = State.cart.find(item => item.productId === productId);
      if (existing) {
        if (existing.qty + 1 > prod.stock && !State.settings.allowNegativeStock) {
          showToast(`Cannot add more than available stock (${prod.stock})`, 'warning');
          return;
        }
        existing.qty += 1;
        existing.total = existing.qty * existing.price;
      } else {
        State.cart.push({
          productId: prod.id,
          name: prod.name,
          sku: prod.sku,
          price: prod.price,
          cost: prod.cost,
          qty: 1,
          total: prod.price
        });
      }

      refreshPOSCartUI();
    }

    function updateCartQty(productId, delta) {
      const item = State.cart.find(i => i.productId === productId);
      const prod = State.products.find(p => p.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        State.cart = State.cart.filter(i => i.productId !== productId);
      } else {
        if (prod && item.qty > prod.stock && !State.settings.allowNegativeStock) {
          item.qty = prod.stock;
          showToast(`Capped at maximum in-stock quantity (${prod.stock})`, 'warning');
        }
        item.total = item.qty * item.price;
      }
      refreshPOSCartUI();
    }

    function clearCart() {
      State.cart = [];

    }

      const itemsList = document.getElementById('posCartItemsList');

    function filterInvoicesTable() {

      const status = document.getElementById('invStatusFilter')?.value || '';
      const dateRange = document.getElementById('invDateFilter')?.value || 'all';
      const now = Date.now();

      const filtered = getSortedInvoices().filter(inv => {
        const custName = (inv.customer?.name || 'walk-in').toLowerCase();
        const custBiz = (inv.customer?.business || '').toLowerCase();
        const matchesQ = inv.id.toLowerCase().includes(q) || custName.includes(q) || custBiz.includes(q);
        const matchesStatus = !status || inv.status === status;

        let matchesDate = true;
        const invTime = new Date(inv.date).getTime();
        if (dateRange === 'today') {
          matchesDate = new Date(inv.date).toDateString() === new Date().toDateString();

          matchesDate = (now - invTime) <= 7 * 86400000;
        } else if (dateRange === 'month') {
          matchesDate = (now - invTime) <= 30 * 86400000;

        return matchesQ && matchesStatus && matchesDate;
