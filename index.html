    /* Date Boundary Calculations for Revenue & Profits (Aliased to canonical engine) */
    const getRevProfitsDateBounds = getDateRangeBounds;

    /* Filter sales by bounds & optional criteria */
    function getRevProfitsFilteredSales(start, end, filters = {}) {
      return State.sales.filter(s => {
        if (!s || !s.date) return false;
        const t = new Date(s.date).getTime();
        if (t < start.getTime() || t > end.getTime()) return false;

        if (filters.paymentStatus && filters.paymentStatus !== 'all') {
          if (s.status !== filters.paymentStatus) return false;
        }
        if (filters.salesStatus && filters.salesStatus !== 'all') {
          if (filters.salesStatus === 'Completed' && s.status === 'Returned') return false;
          if (filters.salesStatus === 'Returned' && s.status !== 'Returned') return false;
        }
        if (filters.selectedCustomer && filters.selectedCustomer !== 'all') {
          if (s.customerId !== filters.selectedCustomer && s.customerName !== filters.selectedCustomer) return false;
        }
        if (filters.selectedProduct && filters.selectedProduct !== 'all') {
          const hasProd = (s.items || []).some(it => it.productId === filters.selectedProduct || it.name === filters.selectedProduct);
          if (!hasProd) return false;
        }
        if (filters.selectedCategory && filters.selectedCategory !== 'all') {
          const hasCat = (s.items || []).some(it => {
            const prod = State.products.find(p => p.id === it.productId || p.name === it.name);
            return prod && prod.category === filters.selectedCategory;
          });
          if (!hasCat) return false;
        }

        return true;
      });
    }

    /* Filter expenses by bounds */
    function getRevProfitsFilteredExpenses(start, end, filters = {}) {
      return State.expenses.filter(e => {
        if (!e || !e.date) return false;
        const t = new Date(e.date).getTime();
        return t >= start.getTime() && t <= end.getTime();
      });
    }

    /* Core Metrics Aggregator (Delegates to centralized calculateFinancials for 100% sync) */
    function calculateRevenueProfitsMetrics(filters = State.revenueProfits || {}) {
      const activeRange = filters.dateRange || State.dashboardDateRange || '30D';
      const cur = calculateFinancials(activeRange, filters.customStart, filters.customEnd, filters);
      const bounds = cur.bounds;

      let prev = {
        grossSales: 0,
        returnsTotal: 0,
        returnsCount: 0,
        netRevenue: 0,
        totalRevenue: 0,
        totalCOGS: 0,
        grossProfit: 0,
        totalExpenses: 0,
        netProfit: 0,
        grossMargin: 0,
        netMargin: 0,
        qualifyingCount: 0,
        totalSalesCount: 0,
        totalUnits: 0,
        avgOrderValue: 0,
        totalDiscount: 0
      };

      if (bounds.prevStart && bounds.prevStart.getTime() > 0 && bounds.prevEnd && bounds.prevEnd.getTime() > 0) {
        const pSales = getRevProfitsFilteredSales(bounds.prevStart, bounds.prevEnd, filters);
        const pExpenses = getRevProfitsFilteredExpenses(bounds.prevStart, bounds.prevEnd, filters);

        let pGrossSales = 0;
        let pReturnsTotal = 0;
        let pReturnsCount = 0;
        let pQualifyingCount = 0;
        let pTotalCOGS = 0;
        let pTotalUnits = 0;

        pSales.forEach(s => {
          const tot = Number(s.total || 0);
          const c = Number(s.cogs || 0);
          const u = (s.items || []).reduce((acc, it) => acc + (Number(it.qty) || 0), 0);
          pTotalUnits += u;

          if (s.status === 'Returned') {
            pReturnsTotal += tot;
            pReturnsCount++;
          } else {
            pGrossSales += tot;
            pTotalCOGS += c;
            pQualifyingCount++;
          }
        });

        const pNetRevenue = pGrossSales;
        const pGrossProfit = pNetRevenue - pTotalCOGS;
        const pTotalExpenses = pExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const pNetProfit = pGrossProfit - pTotalExpenses;
        const pGrossMargin = pNetRevenue > 0 ? (pGrossProfit / pNetRevenue) * 100 : 0;
        const pNetMargin = pNetRevenue > 0 ? (pNetProfit / pNetRevenue) * 100 : 0;
        const pAvgOrderValue = pQualifyingCount > 0 ? pNetRevenue / pQualifyingCount : 0;

        prev = {
          grossSales: pGrossSales,
          returnsTotal: pReturnsTotal,
          returnsCount: pReturnsCount,
          netRevenue: pNetRevenue,
          totalRevenue: pNetRevenue,
          totalCOGS: pTotalCOGS,
          grossProfit: pGrossProfit,
          totalExpenses: pTotalExpenses,
          netProfit: pNetProfit,
          grossMargin: pGrossMargin,
          netMargin: pNetMargin,
          qualifyingCount: pQualifyingCount,
          totalSalesCount: pQualifyingCount,
          totalUnits: pTotalUnits,
          avgOrderValue: pAvgOrderValue,
          totalDiscount: 0
        };
      }

      function getDiff(cVal, pVal) {
        if (!pVal || pVal === 0) {
          return cVal > 0 ? { text: 'New', pct: 100, up: true, valid: false } : { text: 'N/A', pct: 0, up: true, valid: false };
        }
        const pct = ((cVal - pVal) / pVal) * 100;
        return {
          text: `${pct >= 0 ? '↑ +' : '↓ '}${pct.toFixed(1)}% vs prev`,
          pct: pct,
          up: pct >= 0,
          valid: true
        };
      }

      return {
        bounds,
        current: cur,
        previous: prev,
        deltas: {
          revenue: getDiff(cur.netRevenue, prev.netRevenue),
          grossProfit: getDiff(cur.grossProfit, prev.grossProfit),
          netProfit: getDiff(cur.netProfit, prev.netProfit),
          salesCount: getDiff(cur.qualifyingCount, prev.qualifyingCount),
          expenses: getDiff(cur.totalExpenses, prev.totalExpenses),
          cogs: getDiff(cur.totalCOGS, prev.totalCOGS),
          aov: getDiff(cur.avgOrderValue, prev.avgOrderValue)
        }
      };
    }

    /* Monthly Aggregator (Jan-Dec for a year) */
    function aggregateMonthlyFinancials(year = new Date().getFullYear(), filters = {}) {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const monthShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      
      const months = [];
      let yearRevenue = 0;
      let yearCOGS = 0;
      let yearGrossProfit = 0;
      let yearExpenses = 0;
      let yearNetProfit = 0;
      let yearSalesCount = 0;
      let yearUnits = 0;

      for (let m = 0; m < 12; m++) {
        const start = new Date(year, m, 1, 0, 0, 0, 0);
        const end = new Date(year, m + 1, 0, 23, 59, 59, 999);
        
        const mSales = getRevProfitsFilteredSales(start, end, filters);
        const mExpenses = getRevProfitsFilteredExpenses(start, end, filters);

        let rev = 0;
        let cogs = 0;
        let salesCount = 0;
        let units = 0;

        mSales.forEach(s => {
          if (s.status !== 'Returned') {
            rev += Number(s.total || 0);
            cogs += Number(s.cogs || 0);
            salesCount++;
            units += (s.items || []).reduce((acc, it) => acc + (Number(it.qty) || 0), 0);
          }
        });

        const exp = mExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const gp = rev - cogs;
        const np = gp - exp;
        const gm = rev > 0 ? (gp / rev) * 100 : 0;
        const nm = rev > 0 ? (np / rev) * 100 : 0;

        yearRevenue += rev;
        yearCOGS += cogs;
        yearGrossProfit += gp;
        yearExpenses += exp;
        yearNetProfit += np;
        yearSalesCount += salesCount;
        yearUnits += units;

        months.push({
          monthIndex: m,
          name: monthNames[m],
          short: monthShort[m],
          revenue: rev,
          cogs: cogs,
          grossProfit: gp,
          expenses: exp,
          netProfit: np,
          grossMargin: gm,
          netMargin: nm,
          salesCount: salesCount,
          unitsSold: units
        });
      }

      const yearGrossMargin = yearRevenue > 0 ? (yearGrossProfit / yearRevenue) * 100 : 0;
      const yearNetMargin = yearRevenue > 0 ? (yearNetProfit / yearRevenue) * 100 : 0;

      return {
        year,
        months,
        totals: {
          revenue: yearRevenue,
          cogs: yearCOGS,
          grossProfit: yearGrossProfit,
          expenses: yearExpenses,
          netProfit: yearNetProfit,
          grossMargin: yearGrossMargin,
          netMargin: yearNetMargin,
          salesCount: yearSalesCount,
          unitsSold: yearUnits
        }
      };
    }

    /* Daily Aggregator (Days 1..N for a month) */
    function aggregateDailyFinancials(year = new Date().getFullYear(), monthIndex = new Date().getMonth(), filters = {}) {
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const days = [];

      let monthRevenue = 0;
      let monthCOGS = 0;
      let monthGrossProfit = 0;
      let monthExpenses = 0;
      let monthNetProfit = 0;
      let monthSalesCount = 0;
      let monthUnits = 0;

      for (let d = 1; d <= daysInMonth; d++) {
        const start = new Date(year, monthIndex, d, 0, 0, 0, 0);
        const end = new Date(year, monthIndex, d, 23, 59, 59, 999);

        const dSales = getRevProfitsFilteredSales(start, end, filters);
        const dExpenses = getRevProfitsFilteredExpenses(start, end, filters);

        let grossSales = 0;
        let discounts = 0;
        let returns = 0;
        let netRev = 0;
        let cogs = 0;
        let salesCount = 0;
        let units = 0;

        dSales.forEach(s => {
          const tot = Number(s.total || 0);
          const disc = Number(s.discount || 0);
          const u = (s.items || []).reduce((acc, it) => acc + (Number(it.qty) || 0), 0);
          
          discounts += disc;
          units += u;

          if (s.status === 'Returned') {
            returns += tot;
          } else {
            grossSales += tot;
            netRev += tot;
            cogs += Number(s.cogs || 0);
            salesCount++;
          }
        });

        const exp = dExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const gp = netRev - cogs;
        const np = gp - exp;

        monthRevenue += netRev;
        monthCOGS += cogs;
        monthGrossProfit += gp;
        monthExpenses += exp;
        monthNetProfit += np;
        monthSalesCount += salesCount;
        monthUnits += units;

        days.push({
          day: d,
          dateStr: `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`,
          salesCount,
          unitsSold: units,
          grossSales,
          discounts,
          returns,
          netRevenue: netRev,
          cogs,
          grossProfit: gp,
          expenses: exp,
          netProfit: np
        });
      }

      return {
        year,
        monthIndex,
        daysInMonth,
        days,
        totals: {
          revenue: monthRevenue,
          cogs: monthCOGS,
          grossProfit: monthGrossProfit,
          expenses: monthExpenses,
          netProfit: monthNetProfit,
          salesCount: monthSalesCount,
          unitsSold: monthUnits
        }
      };
    }

    /* Product Profitability & Ranking */
    function calculateProductProfitability(filters = {}, limit = 10, sortBy = 'revenue') {
      const bounds = getRevProfitsDateBounds(filters.dateRange || 'This Month', filters.customStart, filters.customEnd);
      const sales = getRevProfitsFilteredSales(bounds.start, bounds.end, filters);

      const productMap = {};

      sales.forEach(s => {
        if (s.status === 'Returned') return;
        (s.items || []).forEach(it => {
          const pid = it.productId || it.name;
          if (!productMap[pid]) {
            const pObj = State.products.find(p => p.id === it.productId || p.name === it.name) || {};
            productMap[pid] = {
              id: pid,
              name: it.name || pObj.name || 'Unknown Product',
              sku: it.sku || pObj.sku || 'N/A',
              category: pObj.category || 'General',
              unitsSold: 0,
              revenue: 0,
              cogs: 0,
              grossProfit: 0
            };
          }
          const qty = Number(it.qty || 0);
          const price = Number(it.price || 0);
          const cost = Number(it.cost || 0);
          const rev = Number(it.total || (price * qty));
          const itemCogs = cost * qty;

          productMap[pid].unitsSold += qty;
          productMap[pid].revenue += rev;
          productMap[pid].cogs += itemCogs;
          productMap[pid].grossProfit += (rev - itemCogs);
        });
      });

      const list = Object.values(productMap).map(p => {
        p.margin = p.revenue > 0 ? (p.grossProfit / p.revenue) * 100 : 0;
        return p;
      });

      if (sortBy === 'profit') {
        list.sort((a, b) => b.grossProfit - a.grossProfit);
      } else {
        list.sort((a, b) => b.revenue - a.revenue);
      }

      return limit ? list.slice(0, limit) : list;
    }

    /* Category Revenue Distribution */
    function calculateCategoryRevenueDistribution(filters = {}) {
      const bounds = getRevProfitsDateBounds(filters.dateRange || 'This Month', filters.customStart, filters.customEnd);
      const sales = getRevProfitsFilteredSales(bounds.start, bounds.end, filters);

      const catMap = {};
      let grandTotal = 0;

      sales.forEach(s => {
        if (s.status === 'Returned') return;
        (s.items || []).forEach(it => {
          const pObj = State.products.find(p => p.id === it.productId || p.name === it.name);
          const cat = (pObj && pObj.category) ? pObj.category : 'General';
          const rev = Number(it.total || ((it.price || 0) * (it.qty || 0)));
          catMap[cat] = (catMap[cat] || 0) + rev;
          grandTotal += rev;
        });
      });

      const list = Object.keys(catMap).map(name => {
        const revenue = catMap[name];
        const pct = grandTotal > 0 ? (revenue / grandTotal) * 100 : 0;
        return { name, revenue, pct };
      });

      list.sort((a, b) => b.revenue - a.revenue);
      return { list, grandTotal };
    }

    /* SVG Generator: Annual 12-Month Performance Chart */
    function generateAnnualMixedChartSVG(annualData) {
      const months = annualData.months;
      const maxVal = Math.max(...months.map(m => Math.max(m.revenue, m.grossProfit, m.netProfit, m.expenses)), 1000);
      const W = 780;
      const H = 220;
      const padL = 40;
      const padR = 20;
      const padT = 20;
      const padB = 30;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const colW = chartW / 12;

      let revBars = '';
      let gpPoints = [];
      let npPoints = [];
      let hoverCols = '';

      months.forEach((m, i) => {
        const cx = padL + (i * colW) + (colW / 2);
        const barW = Math.min(colW * 0.45, 26);
        const barX = cx - (barW / 2);
        
        const revH = Math.max(0, (m.revenue / maxVal) * chartH);
        const revY = padT + (chartH - revH);
        revBars += `<rect x="${barX.toFixed(1)}" y="${revY.toFixed(1)}" width="${barW.toFixed(1)}" height="${revH.toFixed(1)}" rx="4" fill="url(#annualRevGrad)" />`;

        const gpY = padT + (chartH - Math.max(0, (m.grossProfit / maxVal) * chartH));
        gpPoints.push(`${cx.toFixed(1)},${gpY.toFixed(1)}`);

        const npY = padT + (chartH - Math.max(0, (m.netProfit / maxVal) * chartH));
        npPoints.push(`${cx.toFixed(1)},${npY.toFixed(1)}`);

        const colLeft = padL + (i * colW);
        hoverCols += `
          <rect x="${colLeft.toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${chartH}" fill="transparent" style="cursor:pointer;"
            onmouseenter="showRevenueChartTooltip(event, '${m.name} ${annualData.year}', '${formatMoney(m.revenue)}', '${formatMoney(m.grossProfit)}', '${formatMoney(m.netProfit)}', ${m.salesCount}, '${formatMoney(m.expenses)}')"
            onmousemove="moveRevenueChartTooltip(event)"
            onmouseleave="hideRevenueChartTooltip()" />
        `;
      });

      const gpPath = gpPoints.length > 0 ? `M ${gpPoints.join(' L ')}` : '';
      const npPath = npPoints.length > 0 ? `M ${npPoints.join(' L ')}` : '';

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none" style="overflow:visible;">
          <defs>
            <linearGradient id="annualRevGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.3"/>
            </linearGradient>
          </defs>
          <!-- Gridlines -->
          <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--border-color)" stroke-dasharray="3" />
          <line x1="${padL}" y1="${padT + chartH * 0.33}" x2="${W - padR}" y2="${padT + chartH * 0.33}" stroke="var(--border-color)" stroke-dasharray="3" />
          <line x1="${padL}" y1="${padT + chartH * 0.66}" x2="${W - padR}" y2="${padT + chartH * 0.66}" stroke="var(--border-color)" stroke-dasharray="3" />
          <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="var(--border-color)" />

          <!-- Revenue Bars -->
          ${revBars}

          <!-- Gross Profit Curve -->
          <path d="${gpPath}" fill="none" stroke="var(--success)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Net Profit Curve -->
          <path d="${npPath}" fill="none" stroke="var(--purple)" stroke-width="2.5" stroke-dasharray="4" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Dots for lines -->
          ${
            months.map((m, i) => {
              const cx = padL + (i * colW) + (colW / 2);
              const gpY = padT + (chartH - Math.max(0, (m.grossProfit / maxVal) * chartH));
              const npY = padT + (chartH - Math.max(0, (m.netProfit / maxVal) * chartH));
              return `
                <circle cx="${cx.toFixed(1)}" cy="${gpY.toFixed(1)}" r="4" fill="var(--success)" stroke="#fff" stroke-width="2"/>
                <circle cx="${cx.toFixed(1)}" cy="${npY.toFixed(1)}" r="3.5" fill="var(--purple)" stroke="#fff" stroke-width="1.5"/>
              `;
            }).join('')
          }

          <!-- X-Axis Labels -->
          ${
            months.map((m, i) => {
              const cx = padL + (i * colW) + (colW / 2);
              return `<text x="${cx.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--text-muted)" font-family="'Plus Jakarta Sans', sans-serif">${m.short}</text>`;
            }).join('')
          }

          <!-- Hover Overlay -->
          ${hoverCols}
        </svg>
      `;
    }

    /* SVG Generator: Current Month Daily Performance Chart */
    function generateDailyPerformanceChartSVG(dailyData) {
      const days = dailyData.days;
      const maxVal = Math.max(...days.map(d => Math.max(d.netRevenue, d.grossProfit, d.netProfit)), 500);
      const W = 840;
      const H = 200;
      const padL = 35;
      const padR = 20;
      const padT = 18;
      const padB = 28;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const stepX = chartW / (days.length > 1 ? (days.length - 1) : 1);

      let areaPoints = [];
      let gpPoints = [];
      let hoverCols = '';

      days.forEach((d, i) => {
        const x = padL + (i * stepX);
        const revY = padT + (chartH - Math.max(0, (d.netRevenue / maxVal) * chartH));
        const gpY = padT + (chartH - Math.max(0, (d.grossProfit / maxVal) * chartH));

        areaPoints.push(`${x.toFixed(1)},${revY.toFixed(1)}`);
        gpPoints.push(`${x.toFixed(1)},${gpY.toFixed(1)}`);

        const colLeft = Math.max(padL, x - (stepX / 2));
        hoverCols += `
          <rect x="${colLeft.toFixed(1)}" y="${padT}" width="${stepX.toFixed(1)}" height="${chartH}" fill="transparent" style="cursor:pointer;"
            onmouseenter="showRevenueChartTooltip(event, '${d.dateStr}', '${formatMoney(d.netRevenue)}', '${formatMoney(d.grossProfit)}', '${formatMoney(d.netProfit)}', ${d.salesCount}, '${formatMoney(d.expenses)}')"
            onmousemove="moveRevenueChartTooltip(event)"
            onmouseleave="hideRevenueChartTooltip()" />
        `;
      });

      const linePath = areaPoints.length > 0 ? `M ${areaPoints.join(' L ')}` : '';
      const areaPath = areaPoints.length > 0 ? `${linePath} L ${(padL + chartW).toFixed(1)},${(padT + chartH).toFixed(1)} L ${padL},${(padT + chartH).toFixed(1)} Z` : '';
      const gpPath = gpPoints.length > 0 ? `M ${gpPoints.join(' L ')}` : '';

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none" style="overflow:visible;">
          <defs>
            <linearGradient id="dailyRevGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <!-- Gridlines -->
          <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--border-color)" stroke-dasharray="3" />
          <line x1="${padL}" y1="${padT + chartH * 0.5}" x2="${W - padR}" y2="${padT + chartH * 0.5}" stroke="var(--border-color)" stroke-dasharray="3" />
          <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="var(--border-color)" />

          <!-- Revenue Area & Line -->
          <path d="${areaPath}" fill="url(#dailyRevGrad)" />
          <path d="${linePath}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" />

          <!-- Gross Profit Curve -->
          <path d="${gpPath}" fill="none" stroke="var(--success)" stroke-width="2" stroke-dasharray="3" stroke-linejoin="round" />

          <!-- X-Axis Labels: every few days to avoid overlap -->
          ${
            days.map((d, i) => {
              if (i === 0 || i === days.length - 1 || d.day % 5 === 0) {
                const x = padL + (i * stepX);
                return `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--text-muted)" font-family="'JetBrains Mono', monospace">Day ${d.day}</text>`;
              }
              return '';
            }).join('')
          }

          <!-- Hover Overlay -->
          ${hoverCols}
        </svg>
      `;
    }

    /* SVG Generator: Revenue vs Operating Profit Trajectory */
    function generateRevenueVsProfitTrajectorySVG(monthlyData) {
      const months = monthlyData.months;
      const maxVal = Math.max(...months.map(m => Math.max(m.revenue, m.netProfit)), 500);
      const W = 420;
      const H = 160;
      const padL = 30;
      const padR = 15;
      const padT = 15;
      const padB = 25;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const stepX = chartW / 11;

      let revPoints = [];
      let npPoints = [];

      months.forEach((m, i) => {
        const x = padL + (i * stepX);
        const rY = padT + (chartH - Math.max(0, (m.revenue / maxVal) * chartH));
        const nY = padT + (chartH - Math.max(0, (m.netProfit / maxVal) * chartH));
        revPoints.push(`${x.toFixed(1)},${rY.toFixed(1)}`);
        npPoints.push(`${x.toFixed(1)},${nY.toFixed(1)}`);
      });

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">
          <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--border-color)" stroke-dasharray="3"/>
          <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="var(--border-color)"/>
          <path d="M ${revPoints.join(' L ')}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M ${npPoints.join(' L ')}" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3"/>
          <text x="${padL}" y="${H - 6}" font-size="10" fill="var(--text-muted)">Jan</text>
          <text x="${W / 2}" y="${H - 6}" font-size="10" fill="var(--text-muted)" text-anchor="middle">Jun</text>
          <text x="${W - padR}" y="${H - 6}" font-size="10" fill="var(--text-muted)" text-anchor="end">Dec</text>
        </svg>
      `;
    }

    /* SVG Generator: Profit Margin Trendline */
    function generateMarginTrendSVG(monthlyData) {
      const months = monthlyData.months;
      const W = 420;
      const H = 160;
      const padL = 35;
      const padR = 15;
      const padT = 15;
      const padB = 25;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;
      const stepX = chartW / 11;

      let gmPoints = [];
      let nmPoints = [];

      months.forEach((m, i) => {
        const x = padL + (i * stepX);
        const clampedGM = Math.min(Math.max(m.grossMargin, 0), 100);
        const clampedNM = Math.min(Math.max(m.netMargin, 0), 100);
        const gmY = padT + (chartH - (clampedGM / 100) * chartH);
        const nmY = padT + (chartH - (clampedNM / 100) * chartH);
        gmPoints.push(`${x.toFixed(1)},${gmY.toFixed(1)}`);
        nmPoints.push(`${x.toFixed(1)},${nmY.toFixed(1)}`);
      });

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">
          <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--border-color)" stroke-dasharray="3"/>
          <line x1="${padL}" y1="${padT + chartH * 0.5}" x2="${W - padR}" y2="${padT + chartH * 0.5}" stroke="var(--border-color)" stroke-dasharray="3"/>
          <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="var(--border-color)"/>
          <text x="${padL - 6}" y="${padT + 4}" font-size="9" fill="var(--text-muted)" text-anchor="end">100%</text>
          <text x="${padL - 6}" y="${padT + chartH * 0.5 + 3}" font-size="9" fill="var(--text-muted)" text-anchor="end">50%</text>
          <text x="${padL - 6}" y="${padT + chartH}" font-size="9" fill="var(--text-muted)" text-anchor="end">0%</text>
          <path d="M ${gmPoints.join(' L ')}" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M ${nmPoints.join(' L ')}" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3"/>
          <text x="${padL}" y="${H - 6}" font-size="10" fill="var(--text-muted)">Jan</text>
          <text x="${W / 2}" y="${H - 6}" font-size="10" fill="var(--text-muted)" text-anchor="middle">Jun</text>
          <text x="${W - padR}" y="${H - 6}" font-size="10" fill="var(--text-muted)" text-anchor="end">Dec</text>
        </svg>
      `;
    }

    function renderRevProfitsDailyTableRows(daysList) {
      if (!daysList || daysList.length === 0) {
        return `<tr><td colspan="11"><div class="empty-state">No daily records match criteria.</div></td></tr>`;
      }
      return daysList.map(d => `
        <tr>
          <td style="font-weight:700; font-family:'JetBrains Mono'; font-size:11.5px;">${d.dateStr}</td>
          <td>${d.salesCount > 0 ? `<span class="badge badge-purple">${d.salesCount}</span>` : '0'}</td>
          <td>${d.unitsSold}</td>
          <td>${formatMoney(d.grossSales)}</td>
          <td style="color:var(--text-muted);">${formatMoney(d.discounts)}</td>
          <td style="color:${d.returns > 0 ? 'var(--danger)' : 'var(--text-muted)'};">${formatMoney(d.returns)}</td>
          <td style="font-weight:700; color:var(--primary);">${formatMoney(d.netRevenue)}</td>
          <td style="color:var(--text-muted);">${formatMoney(d.cogs)}</td>
          <td style="font-weight:700; color:var(--success);">${formatMoney(d.grossProfit)}</td>
          <td style="color:${d.expenses > 0 ? 'var(--danger)' : 'var(--text-muted)'};">${formatMoney(d.expenses)}</td>
          <td style="text-align:right; font-weight:800; color:${d.netProfit >= 0 ? 'var(--purple)' : 'var(--danger)'};">${formatMoney(d.netProfit)}</td>
        </tr>
      `).join('');
    }

    function filterRevProfitsDailyTable() {
      const q = (document.getElementById('rpDailyTableSearch')?.value || '').toLowerCase().trim();
      const filters = State.revenueProfits || {};
      const selectedYear = filters.selectedYear || new Date().getFullYear();
      const selectedMonth = filters.selectedMonth !== undefined ? filters.selectedMonth : new Date().getMonth();
      const dailyData = aggregateDailyFinancials(selectedYear, selectedMonth, filters);

      const filtered = dailyData.days.filter(d => d.dateStr.includes(q));
      const tbody = document.querySelector('#rpDailyMasterTable tbody');
      if (tbody) tbody.innerHTML = renderRevProfitsDailyTableRows(filtered);
    }

    /* Controller Action Functions */
    function setRevProfitsDateRange(range) {
      if (!State.revenueProfits) State.revenueProfits = {};
      State.revenueProfits.dateRange = range;
      State.dashboardDateRange = range;
      saveRevProfitsSettings();
      try {
        localStorage.setItem('imp_dashboard_date_range', range);
      } catch(e) {}
      renderCurrentView();
    }

    function applyRevProfitsCustomDate() {
      const start = document.getElementById('rpCustomStartInput')?.value;
      const end = document.getElementById('rpCustomEndInput')?.value;
      if (!start || !end) {
        showToast('Please select both start and end dates', 'warning');
        return;
      }
      if (new Date(start) > new Date(end)) {
        showToast('Start date cannot be after end date', 'warning');
        return;
      }
      State.revenueProfits.customStart = start;
      State.revenueProfits.customEnd = end;
      State.revenueProfits.dateRange = 'Custom';
      saveRevProfitsSettings();
      renderCurrentView();
      showToast(`Custom date range applied: ${start} to ${end}`, 'info');
    }

    function setRevProfitsYear(year) {
      if (!State.revenueProfits) State.revenueProfits = {};
      State.revenueProfits.selectedYear = year;
      saveRevProfitsSettings();
      renderCurrentView();
    }

    function setRevProfitsMonth(mIndex) {
      if (!State.revenueProfits) State.revenueProfits = {};
      State.revenueProfits.selectedMonth = mIndex;
      saveRevProfitsSettings();
      renderCurrentView();
    }

    function changeRevProfitsMonth(delta) {
      if (!State.revenueProfits) State.revenueProfits = {};
      let m = (State.revenueProfits.selectedMonth !== undefined ? State.revenueProfits.selectedMonth : new Date().getMonth()) + delta;
      let y = State.revenueProfits.selectedYear || new Date().getFullYear();
      if (m < 0) {
        m = 11;
        y--;
      } else if (m > 11) {
        m = 0;
        y++;
      }
      State.revenueProfits.selectedMonth = m;
      State.revenueProfits.selectedYear = y;
      saveRevProfitsSettings();
      renderCurrentView();
    }

    function setRevProfitsProductRankLimit(limit) {
      if (!State.revenueProfits) State.revenueProfits = {};
      State.revenueProfits.productRankLimit = limit;
      saveRevProfitsSettings();
      renderCurrentView();
    }

      if (State.revenueProfits) {
        State.revenueProfits[filterKey] = 'all';
        saveRevProfitsSettings();
        renderCurrentView();

    /* CSV Exporter Implementation */
    function exportRevProfitsCSV(type) {
      const filters = State.revenueProfits || {};
      const bounds = getRevProfitsDateBounds(filters.dateRange || 'This Month', filters.customStart, filters.customEnd);
      const nowStr = new Date().toISOString().split('T')[0];

      if (type === 'summary') {
        const m = calculateRevenueProfitsMetrics(filters);
        let csv = 'Metric,Value\n';
        csv += `"Reporting Period","${filters.dateRange || 'This Month'}"\n`;
        csv += `"Start Date","${bounds.start.toISOString().split('T')[0]}"\n`;
        csv += `"End Date","${bounds.end.toISOString().split('T')[0]}"\n`;
        csv += `"Gross Sales Revenue","${m.current.grossSales.toFixed(2)}"\n`;
        csv += `"Sales Returns & Refunds","${m.current.returnsTotal.toFixed(2)}"\n`;
        csv += `"Net Sales Revenue","${m.current.netRevenue.toFixed(2)}"\n`;
        csv += `"Cost of Goods Sold (COGS)","${m.current.totalCOGS.toFixed(2)}"\n`;
        csv += `"Gross Profit","${m.current.grossProfit.toFixed(2)}"\n`;
        csv += `"Operating Expenses","${m.current.totalExpenses.toFixed(2)}"\n`;
        csv += `"Net Operating Profit","${m.current.netProfit.toFixed(2)}"\n`;
        csv += `"Gross Margin %","${m.current.grossMargin.toFixed(2)}%"\n`;
        csv += `"Net Margin %","${m.current.netMargin.toFixed(2)}%"\n`;
        csv += `"Total Sales Count","${m.current.qualifyingCount}"\n`;
        csv += `"Average Order Value","${m.current.avgOrderValue.toFixed(2)}"\n`;
        csv += `"Total Units Sold","${m.current.totalUnits}"\n`;
        downloadFile(csv, `revenue_profit_summary_${nowStr}.csv`, 'text/csv');
      } else if (type === 'monthly') {
        const year = filters.selectedYear || new Date().getFullYear();
        const data = aggregateMonthlyFinancials(year, filters);
        let csv = 'Month,Sales Count,Units Sold,Revenue,COGS,Gross Profit,Expenses,Net Profit,Gross Margin %,Net Margin %\n';
        data.months.forEach(m => {
          csv += `"${m.name} ${year}","${m.salesCount}","${m.unitsSold}","${m.revenue.toFixed(2)}","${m.cogs.toFixed(2)}","${m.grossProfit.toFixed(2)}","${m.expenses.toFixed(2)}","${m.netProfit.toFixed(2)}","${m.grossMargin.toFixed(2)}%","${m.netMargin.toFixed(2)}%"\n`;
        });
        csv += `"Total ${year}","${data.totals.salesCount}","${data.totals.unitsSold}","${data.totals.revenue.toFixed(2)}","${data.totals.cogs.toFixed(2)}","${data.totals.grossProfit.toFixed(2)}","${data.totals.expenses.toFixed(2)}","${data.totals.netProfit.toFixed(2)}","${data.totals.grossMargin.toFixed(2)}%","${data.totals.netMargin.toFixed(2)}%"\n`;
        downloadFile(csv, `monthly_revenue_report_${year}.csv`, 'text/csv');
      } else if (type === 'daily') {
        const year = filters.selectedYear || new Date().getFullYear();
        const month = filters.selectedMonth !== undefined ? filters.selectedMonth : new Date().getMonth();
        const data = aggregateDailyFinancials(year, month, filters);
        let csv = 'Date,Sales Count,Units Sold,Gross Sales,Discounts,Returns,Net Revenue,COGS,Gross Profit,Expenses,Net Profit\n';
        data.days.forEach(d => {
          csv += `"${d.dateStr}","${d.salesCount}","${d.unitsSold}","${d.grossSales.toFixed(2)}","${d.discounts.toFixed(2)}","${d.returns.toFixed(2)}","${d.netRevenue.toFixed(2)}","${d.cogs.toFixed(2)}","${d.grossProfit.toFixed(2)}","${d.expenses.toFixed(2)}","${d.netProfit.toFixed(2)}"\n`;
        });
        downloadFile(csv, `daily_revenue_report_${year}_${month + 1}.csv`, 'text/csv');
      } else if (type === 'products') {
        const list = calculateProductProfitability(filters, 100, 'revenue');
        let csv = 'Product,SKU,Category,Units Sold,Revenue,COGS,Gross Profit,Margin %\n';
        list.forEach(p => {
          csv += `"${p.name}","${p.sku}","${p.category}","${p.unitsSold}","${p.revenue.toFixed(2)}","${p.cogs.toFixed(2)}","${p.grossProfit.toFixed(2)}","${p.margin.toFixed(2)}%"\n`;
        });
        downloadFile(csv, `product_profitability_${nowStr}.csv`, 'text/csv');
      }
      closeModal();
      showToast('CSV export generated successfully!', 'success');
    }

    function renderLowStockTableRows(lowList) {
      if (!lowList || lowList.length === 0) {
        return `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">✅</div><h4>Adequate Inventory</h4><p>No products match the selected criteria.</p></div></td></tr>`;

      return lowList.map(p => {
        const suggestedQty = Math.max(1, (p.reorderLevel * 2) - p.stock);
        const estCost = suggestedQty * p.cost;
        return `

            </td>
            <td>${p.reorderLevel} units</td>
            <td style="font-weight:700; color:var(--primary);">${suggestedQty} units</td>
            <td>${formatMoney(p.cost)}</td>
            <td style="font-weight:700;">${formatMoney(estCost)}</td>

      }).join('');
    }

    function filterLowStockTable() {
      const q = (document.getElementById('lowStockSearch')?.value || '').toLowerCase();
      const cat = document.getElementById('lowStockCategoryFilter')?.value || '';
      const status = document.getElementById('lowStockStatusFilter')?.value || '';

      const low = State.products
        .filter(p => p.stock <= p.reorderLevel)
        .sort((a, b) => (a.stock - b.stock))
        .filter(p => {
          const matchesQ = p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
          const matchesCat = !cat || p.category === cat;
          let matchesStatus = true;
          if (status === 'out_of_stock') matchesStatus = p.stock <= 0;
          if (status === 'low_stock') matchesStatus = p.stock > 0;
          return matchesQ && matchesCat && matchesStatus;
        });

      const tbody = document.querySelector('#lowStockMasterTable tbody');
      if (tbody) tbody.innerHTML = renderLowStockTableRows(low);
    }

    function handleCurrencyPresetChange(val) {
      const symMap = {
        'USD': '$',
        'EUR': '€',
        'GBP': '£',
        'PKR': '₨',
        'INR': '₹',
        'CAD': 'C$',
        'AUD': 'A$',
        'AED': 'AED ',
        'SAR': 'SAR '
      };
      const symInput = document.getElementById('setCurrencySymbol');
      if (symInput && symMap[val]) {
        symInput.value = symMap[val];
      }
    }

    function triggerActiveSettingsSave(tab) {
      if (tab === 'settings_invoice') {
        saveInvoiceSettingsForm();
      } else {
        saveBusinessSettingsForm();
      }
    }

    async function saveBusinessSettingsForm() {
      const bizName = document.getElementById('setBizName')?.value.trim() || State.settings.businessName;
      const currency = document.getElementById('setCurrencySelect')?.value || State.settings.currency;
      const currencySymbol = document.getElementById('setCurrencySymbol')?.value.trim() || '$';
      const decimalPlaces = Number(document.getElementById('setDecimalPlaces')?.value ?? 2);
      const phone = document.getElementById('setPhone')?.value.trim() || '';
      const email = document.getElementById('setEmail')?.value.trim() || '';
      const website = document.getElementById('setWebsite')?.value.trim() || '';
      const address = document.getElementById('setAddress')?.value.trim() || '';
      const taxId = document.getElementById('setTaxId')?.value.trim() || '';
      const defaultTax = Number(document.getElementById('setDefaultTax')?.value || 0);
      const defaultPaymentMethod = document.getElementById('setDefaultPaymentMethod')?.value || 'Cash';
      const allowNegativeStock = !!document.getElementById('setAllowNegativeStock')?.checked;

      const updated = {
        ...State.settings,
        businessName: bizName,
        currency,
        currencySymbol,
        decimalPlaces,
        phone,
        email,
        website,
        address,
        taxId,
        defaultTax,
        defaultPaymentMethod,
        allowNegativeStock,
        id: 'app_settings'
      };

      // 1. In-memory state update
      State.settings = updated;

      // 2. Guaranteed instant persistence to localStorage
      try {
        localStorage.setItem('imp_settings', JSON.stringify(updated));
      } catch(e) {
        console.warn('localStorage save warning:', e);
      }

      // 3. Instant UI synchronization across sidebar, browser title, themes, formatters
      syncSettingsToUI();

      // 4. Asynchronous write to IndexedDB
      await dbPut('settings', updated);

      showToast('Business settings saved & synchronized across entire application!', 'success');
      renderCurrentView();
    }

    async function saveInvoiceSettingsForm() {
      const invoicePrefix = document.getElementById('setInvPrefix')?.value.trim() || 'INV-';
      const invoicePadding = Number(document.getElementById('setInvPadding')?.value || 4);
      const poPrefix = document.getElementById('setPoPrefix')?.value.trim() || 'PO-';

      const paymentInstructions = document.getElementById('setPaymentInstructions')?.value.trim() || '';
      const termsAndConditions = document.getElementById('setTermsConditions')?.value.trim() || '';
      const showTax = !!document.getElementById('setShowTax')?.checked;
      const showDiscount = !!document.getElementById('setShowDiscount')?.checked;

      const updated = {

        invoicePrefix,
        invoicePadding,
        poPrefix,
        thankYouMessage,
        paymentInstructions,
        termsAndConditions,
        showTax,
        showDiscount,
        id: 'app_settings'
      };

      // 1. In-memory state update
      State.settings = updated;

      // 2. Guaranteed instant persistence to localStorage
      try {
        localStorage.setItem('imp_settings', JSON.stringify(updated));
      } catch(e) {
        console.warn('localStorage save warning:', e);
      }

      // 3. UI synchronization
      syncSettingsToUI();

      // 4. Asynchronous write to IndexedDB
      await dbPut('settings', updated);

    function filterStockMovementsTable() {
      const q = (document.getElementById('movSearchInput')?.value || '').toLowerCase();
      const type = document.getElementById('movTypeFilter')?.value || '';
      const dateRange = document.getElementById('movDateFilter')?.value || 'all';
      const now = Date.now();

      const filtered = getSortedStockMovements().filter(m => {
        const matchesQ = m.productName.toLowerCase().includes(q) || (m.sku || '').toLowerCase().includes(q) || (m.ref || '').toLowerCase().includes(q) || m.id.toLowerCase().includes(q);
        const matchesType = !type || m.type.toLowerCase().includes(type.toLowerCase());

        let matchesDate = true;
        const mTime = new Date(m.date).getTime();
        if (dateRange === 'today') {
          matchesDate = new Date(m.date).toDateString() === new Date().toDateString();
        } else if (dateRange === 'week') {
          matchesDate = (now - mTime) <= 7 * 86400000;
        } else if (dateRange === 'month') {
          matchesDate = (now - mTime) <= 30 * 86400000;
        }

        return matchesQ && matchesType && matchesDate;
      });

      const tbody = document.querySelector('#movementsMasterTable tbody');
      if (tbody) tbody.innerHTML = renderStockMovementsTableRows(filtered);

        return matchesQ && matchesType && matchesMethod && matchesDate;

    async function processPOSSale() {
      const subtotal = State.cart.reduce((sum, i) => sum + i.total, 0);
      const taxRate = State.settings.defaultTax || 8.5;
      const tax = Math.round(subtotal * (taxRate / 100) * 100) / 100;
      const grandTotal = subtotal + tax;
      const cogs = State.cart.reduce((sum, i) => sum + (i.cost * i.qty), 0);
      const grossProfit = grandTotal - tax - cogs;

      const method = document.getElementById('checkoutMethod').value;
      const amountPaid = Number(document.getElementById('checkoutAmountPaid').value);
      const balance = Math.max(0, grandTotal - amountPaid);
      const status = balance === 0 ? 'Paid' : 'Partially Paid';

      const saleId = `SALE-${String(State.sales.length + 1).padStart(4, '0')}`;
      const prefix = State.settings.invoicePrefix || 'INV-';
      const pad = Number(State.settings.invoicePadding || 4);
      const invId = `${prefix}${String(State.invoices.length + 1).padStart(pad, '0')}`;
      const date = new Date().toISOString();

      const cust = State.selectedCustomer || {
        id: 'WALK-IN',
        name: 'Walk-in Retail Customer',
        business: ''
      };

      const saleRecord = {
        id: saleId,
        invoiceNumber: invId,
        customerId: cust.id,
        customerName: cust.name,
        customerBusiness: cust.business,
        date,
        items: [...State.cart],
        subtotal,
        tax,
        discount: 0,
        total: grandTotal,
        paid: amountPaid,
        balance,
        cogs,
        grossProfit,
        paymentMethod: method,
        status
      };

      // 1. Save Sale
      await dbPut('sales', saleRecord);

      // 2. Save Invoice
      await dbPut('invoices', {
        id: invId,
        saleId,
        customer: cust,
        date,
        dueDate: date,
        items: [...State.cart],
        subtotal,
        tax,
        discount: 0,
        total: grandTotal,
        paid: amountPaid,
        balance,
        status
      });

      // 3. Deduct Stock & Generate Movement Records
      for (const item of State.cart) {
        const prod = State.products.find(p => p.id === item.productId);
        if (prod) {
          const prevStock = prod.stock;
          prod.stock -= item.qty;
          await dbPut('products', prod);

          await dbPut('stock_movements', {
            id: `MOV-${String(State.stockMovements.length + 1).padStart(4, '0')}`,
            date,
            productId: prod.id,
            productName: prod.name,
            sku: prod.sku,
            type: 'Stock Out (Sale)',
            qtyChange: -item.qty,
            prevQty: prevStock,
            newQty: prod.stock,
            ref: saleId,
            notes: `POS Sale to ${cust.name}`
          });
        }
      }

      // 4. Save Payment
      if (amountPaid > 0) {
        await dbPut('payments', {
          id: `PAY-${String(State.payments.length + 1).padStart(4, '0')}`,
          date,
          type: 'Received',
          entityId: cust.id,
          entityName: cust.name,
          refId: saleId,
          amount: amountPaid,
          method,
          notes: `POS Sale Receipt for ${invId}`
        });
      }

      // 5. Reset Cart & Update
      State.cart = [];
      await loadStateFromDB();
      closeModal();
      showToast(`Sale completed! ${invId} generated.`, 'success');
      viewInvoiceModal(invId);
    }

    /* Template Switcher for Invoice Viewer */
    function switchInvoiceTemplate(template) {
      State.activeInvoiceDesign = template;
      const minEl = document.getElementById('invoiceDesignMinimal');

      const btnMin = document.getElementById('btnSwitchMinimal');
      const btnTherm = document.getElementById('btnSwitchThermal');
      const modalCard = document.querySelector('#activeModalOverlay .modal-card') || document.querySelector('.modal-card');

      if (template === 'thermal') {
        document.body.classList.add('print-thermal-receipt');
        if (minEl) minEl.style.display = 'none';
        if (thermEl) thermEl.style.display = 'block';
        if (btnMin) {
          btnMin.className = 'btn btn-secondary btn-sm';
        }
        if (btnTherm) {
          btnTherm.className = 'btn btn-primary btn-sm';
        }
        if (modalCard) {
          modalCard.classList.remove('modal-lg');
          modalCard.classList.add('modal-sm');
        }
      } else {
        document.body.classList.remove('print-thermal-receipt');
        if (minEl) minEl.style.display = 'block';
        if (thermEl) thermEl.style.display = 'none';
        if (btnMin) {
          btnMin.className = 'btn btn-primary btn-sm';
        }
        if (btnTherm) {
          btnTherm.className = 'btn btn-secondary btn-sm';
        }
        if (modalCard) {
          modalCard.classList.remove('modal-sm');
          modalCard.classList.add('modal-lg');
        }
      }
    }

    /* Global Search Modal */
    function openGlobalSearchModal() {
      openModal(`
        <div class="modal-header">
          <h3>🔍 Global System Search</h3>
          <button class="modal-close-btn" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <input type="text" id="modalGlobalSearchInput" class="form-input" placeholder="Type to search products, customers, invoices..." oninput="handleGlobalSearch(this.value)" autofocus>
          <div id="globalSearchResults" style="display:flex; flex-direction:column; gap:8px; margin-top:12px; max-height:300px; overflow-y:auto;">
            <p style="font-size:12px; color:var(--text-muted);">Start typing to see matching records...</p>
          </div>
        </div>
      `);

    function handleGlobalSearch(q) {
      const term = q.toLowerCase();
      const resContainer = document.getElementById('globalSearchResults');
      if (!term || !resContainer) return;

      const pMatches = State.products.filter(p => p.name.toLowerCase().includes(term) || p.sku.toLowerCase().includes(term));
      const cMatches = State.customers.filter(c => c.name.toLowerCase().includes(term) || c.business.toLowerCase().includes(term));
      const iMatches = State.invoices.filter(i => i.id.toLowerCase().includes(term));

      let html = '';
      if (pMatches.length) {
        html += `<div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Products (${pMatches.length})</div>`;
        pMatches.slice(0, 3).forEach(p => {
          html += `<div style="padding:8px; background:var(--item-bg); border-radius:6px; cursor:pointer;" onclick="closeModal(); navigate('products');">📦 <strong>${p.name}</strong> (${p.sku}) - ${formatMoney(p.price)}</div>`;
        });
      }
      if (cMatches.length) {
        html += `<div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-top:8px;">Customers (${cMatches.length})</div>`;
        cMatches.slice(0, 3).forEach(c => {
          html += `<div style="padding:8px; background:var(--item-bg); border-radius:6px; cursor:pointer;" onclick="closeModal(); navigate('customers');">👥 <strong>${c.name}</strong> - ${c.business}</div>`;
        });
      }
      if (iMatches.length) {
        html += `<div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-top:8px;">Invoices (${iMatches.length})</div>`;
        iMatches.slice(0, 3).forEach(i => {
          html += `<div style="padding:8px; background:var(--item-bg); border-radius:6px; cursor:pointer;" onclick="closeModal(); viewInvoiceModal('${i.id}');">🧾 <strong>${i.id}</strong> - ${formatMoney(i.total)}</div>`;
        });

    async function processStockAdjustment() {
      const prodId = document.getElementById('adjProductSelect').value;
      const type = document.getElementById('adjTypeSelect').value;
      const qty = Number(document.getElementById('adjQtyInput').value);
      const notes = document.getElementById('adjNotesInput').value;

      const prod = State.products.find(p => p.id === prodId);
      if (!prod) return;

      const delta = type.includes('Increase') || type.includes('Returned') ? qty : -qty;
      const prevStock = prod.stock;
      prod.stock += delta;
      await dbPut('products', prod);

      await dbPut('stock_movements', {
        id: `MOV-${String(State.stockMovements.length + 1).padStart(4, '0')}`,
        date: new Date().toISOString(),
        productId: prod.id,
        productName: prod.name,
        sku: prod.sku,
        type,
        qtyChange: delta,
        prevQty: prevStock,
        newQty: prod.stock,
        ref: 'MANUAL-AUDIT',
        notes
      });

      await loadStateFromDB();
      closeModal();
      showToast(`Stock updated for ${prod.name}: ${prod.stock} units`);
      renderCurrentView();
    }

    function handlePoProductSelect(prodId) {
      const prod = State.products.find(p => p.id === prodId);
      if (prod) {
        const input = document.getElementById('mPoUnitCost');
        if (input) input.value = (prod.cost || 0).toFixed(2);

    function calculatePoTotal() {
      const qty = Number(document.getElementById('mPoQty')?.value || 0);
      const cost = Number(document.getElementById('mPoUnitCost')?.value || 0);
      const total = qty * cost;
      const el = document.getElementById('mPoTotalDisplay');

    }

    async function processAddPurchaseOrder(poId) {
      const suppId = document.getElementById('mPoSupplier')?.value;
      const prodId = document.getElementById('mPoProduct')?.value;
      const qty = Number(document.getElementById('mPoQty')?.value || 0);
      const unitCost = Number(document.getElementById('mPoUnitCost')?.value || 0);
      const payStatus = document.getElementById('mPoPaymentStatus')?.value;
      const payMethod = document.getElementById('mPoPaymentMethod')?.value || 'Bank Transfer';

      const supp = State.suppliers.find(s => s.id === suppId);
      const prod = State.products.find(p => p.id === prodId);
      if (!prod || !qty) return;

      const total = Math.round(qty * unitCost * 100) / 100;
      const isPaid = payStatus === 'Paid';

      // 1. Update product stock and intake
      const prevStock = prod.stock;
      prod.stock += qty;
      await dbPut('products', prod);

      // 2. Log stock movement
      await dbPut('stock_movements', {
        id: `MOV-${String(State.stockMovements.length + 1).padStart(4, '0')}`,
        date: new Date().toISOString(),
        productId: prod.id,
        productName: prod.name,
        sku: prod.sku,
        type: 'Stock In',
        qtyChange: qty,
        prevQty: prevStock,
        newQty: prod.stock,
        ref: poId,
        notes: `PO restock from ${supp?.company || 'Supplier'}`
      });

      // 3. Create purchase order
      const newPo = {
        id: poId,
        supplier: supp || { company: 'Supplier' },
        date: new Date().toISOString(),
        items: [{ name: prod.name, qty, cost: unitCost, total }],
        total,
        paid: isPaid ? total : 0,
        balance: isPaid ? 0 : total,
        status: isPaid ? 'Received' : 'Ordered'
      };
      State.purchases.push(newPo);
      await dbPut('purchases', newPo);

      // 4. Record payment if paid
      if (isPaid) {
        const pRecord = {
          id: `PAY-OUT-${String(State.payments.length + 1).padStart(4, '0')}`,
          date: newPo.date,
          type: 'Paid',
          entityName: `${supp?.company || 'Supplier'} (${poId})`,
          amount: total,
          method: payMethod,
          notes: `Purchase intake for ${prod.name} x${qty}`
        };
        State.payments.push(pRecord);
        await dbPut('payments', pRecord);
      }

      await loadStateFromDB();
      closeModal();
      showToast(`Purchase Order ${poId} created & ${qty} units added to stock!`, 'success');
      renderCurrentView();
    }

    async function processSaleReturn(saleId) {
      const sale = State.sales.find(s => s.id === saleId);
      if (!sale) return;

      const reason = document.getElementById('mReturnReason')?.value || 'Customer Return';
      const restock = !!document.getElementById('mRestockItems')?.checked;
      const refundAmt = Number(document.getElementById('mRefundAmount')?.value || sale.total);

      if (restock && sale.items && sale.items.length > 0) {
        for (const it of sale.items) {
          const prod = State.products.find(p => p.id === it.productId || p.name === it.name);
          if (prod) {
            const prev = prod.stock;
            prod.stock += (it.qty || 1);
            await dbPut('products', prod);

            await dbPut('stock_movements', {
              id: `MOV-${String(State.stockMovements.length + 1).padStart(4, '0')}`,
              date: new Date().toISOString(),
              productId: prod.id,
              productName: prod.name,
              sku: prod.sku,
              type: 'Returned',
              qtyChange: it.qty || 1,
              prevQty: prev,
              newQty: prod.stock,
              ref: sale.invoiceNumber || sale.id,
              notes: `Customer return: ${reason}`
            });
          }
        }
      }

      // Mark sale status as Returned
      sale.status = 'Returned';
      await dbPut('sales', sale);

      // Record outflow payment
      const pRecord = {
        id: `PAY-OUT-${String(State.payments.length + 1).padStart(4, '0')}`,
        date: new Date().toISOString(),
        type: 'Paid',
        entityName: `${sale.customerName} (Return Refund)`,
        amount: refundAmt,
        method: sale.paymentMethod || 'Cash',
        notes: `Refund for ${sale.invoiceNumber}: ${reason}`
      };
      State.payments.push(pRecord);
      await dbPut('payments', pRecord);

      await loadStateFromDB();
      closeModal();
      showToast(`Sale ${sale.id} returned & refunded successfully!`, 'success');
      renderCurrentView();

    async function saveEditProductForm(productId) {
      const prod = State.products.find(p => p.id === productId);
      if (!prod) return;

      prod.name = document.getElementById('mEditProdName')?.value.trim() || prod.name;
      prod.sku = document.getElementById('mEditProdSku')?.value.trim() || prod.sku;
      prod.category = document.getElementById('mEditProdCategory')?.value || prod.category;
      prod.unit = document.getElementById('mEditProdUnit')?.value || prod.unit;
      prod.cost = Number(document.getElementById('mEditProdCost')?.value || 0);
      prod.price = Number(document.getElementById('mEditProdPrice')?.value || 0);
      const newStock = Number(document.getElementById('mEditProdStock')?.value || 0);
      const stockDiff = newStock - prod.stock;
      prod.stock = newStock;
      prod.reorderLevel = Number(document.getElementById('mEditProdReorder')?.value || 10);
      prod.updatedAt = new Date().toISOString();

      await dbPut('products', prod);

      if (stockDiff !== 0) {
        await dbPut('stock_movements', {
          id: `MOV-${String(State.stockMovements.length + 1).padStart(4, '0')}`,
          date: new Date().toISOString(),
          productId: prod.id,
          productName: prod.name,
          sku: prod.sku,
          type: stockDiff > 0 ? 'Adjustment Increase' : 'Adjustment Decrease',
          qtyChange: stockDiff,
          prevQty: prod.stock - stockDiff,
          newQty: prod.stock,
          ref: 'EDIT-OVERRIDE',
          notes: 'Product edit stock update'
        });
      }

      await loadStateFromDB();
      closeModal();
      showToast(`Product "${prod.name}" updated successfully!`, 'success');
      renderCurrentView();

    function handleEditInvStatusChange(status, total) {
      const paidInput = document.getElementById('mEditInvPaid');
      if (!paidInput) return;
      if (status === 'Paid') paidInput.value = total;
      else if (status === 'Unpaid') paidInput.value = 0;
      calculateEditInvBalance();
    }

    function calculateEditInvBalance() {
      const total = Number(document.getElementById('mEditInvTotal')?.value || 0);
      const paid = Number(document.getElementById('mEditInvPaid')?.value || 0);
      const bal = Math.max(0, total - paid);
      const balDisp = document.getElementById('mEditInvBalanceDisplay');
      if (balDisp) balDisp.value = formatMoney(bal);
    }

    async function saveEditInvoiceForm(invoiceId) {
      const inv = State.invoices.find(i => i.id === invoiceId);
      if (!inv) return;

      const status = document.getElementById('mEditInvStatus')?.value || inv.status;
      const total = Number(document.getElementById('mEditInvTotal')?.value || inv.total);
      const paid = Number(document.getElementById('mEditInvPaid')?.value || inv.paid);
      const dueDate = document.getElementById('mEditInvDueDate')?.value || inv.dueDate;
      const balance = Math.max(0, total - paid);

      inv.status = status;
      inv.total = total;
      inv.paid = paid;
      inv.balance = balance;
      if (dueDate) inv.dueDate = new Date(dueDate).toISOString();

      await dbPut('invoices', inv);

      // Sync matching sale if exists
      const sale = State.sales.find(s => s.invoiceNumber === inv.id || s.id === inv.saleId);
      if (sale) {
        sale.status = status;
        sale.total = total;
        sale.paid = paid;
        sale.balance = balance;
        await dbPut('sales', sale);
      }

      await loadStateFromDB();
      closeModal();
      showToast(`Invoice ${inv.id} updated!`, 'success');
      renderCurrentView();
    }

    /* JSON Backup & Restore */
    function downloadJSONBackup() {
      const backup = {
        exportedAt: new Date().toISOString(),
        products: State.products,
        categories: State.categories,
        brands: State.brands,
        stockMovements: State.stockMovements,
        sales: State.sales,
        purchases: State.purchases,
        customers: State.customers,
        suppliers: State.suppliers,
        invoices: State.invoices,
        payments: State.payments,
        expenses: State.expenses,
        settings: State.settings
      };
      const json = JSON.stringify(backup, null, 2);
      downloadFile(json, `inventory-management-backup-${new Date().toISOString().slice(0,10)}.json`, 'application/json');
      showToast('Full backup downloaded!');
    }

    function handleJSONRestore() {
      const fileInput = document.getElementById('jsonBackupFileInput');
      if (!fileInput || !fileInput.files.length) {
        showToast('Please select a .json backup file first', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data.products) throw new Error('Invalid backup schema');

          if (!confirm(`Restore backup from ${data.exportedAt}? This will replace current records.`)) return;

          // Clear existing
          const stores = ['products', 'categories', 'brands', 'stock_movements', 'sales', 'purchases', 'customers', 'suppliers', 'invoices', 'payments', 'expenses', 'settings'];
          for (const s of stores) {
            await dbClear(s);
            if (data[s] && Array.isArray(data[s])) {
              for (const item of data[s]) await dbPut(s, item);
            }
          }
          if (data.settings) {
            State.settings = { ...State.settings, ...data.settings };
            try {
              localStorage.setItem('imp_settings', JSON.stringify(State.settings));
            } catch(e) {}
            await dbPut('settings', State.settings);
          }

          await loadStateFromDB();
          showToast('Backup restored successfully!', 'success');
          renderCurrentView();
        } catch(err) {
          showToast('Failed to parse backup file', 'error');
        }
      };
      reader.readAsText(fileInput.files[0]);
    }

    async function promptClearAllData() {
      const input = prompt('Type DELETE to permanently clear all local records:');
      if (input === 'DELETE') {
        const stores = ['products', 'categories', 'brands', 'stock_movements', 'sales', 'purchases', 'customers', 'suppliers', 'invoices', 'payments', 'expenses', 'settings'];
        for (const s of stores) await dbClear(s);
        localStorage.removeItem('imp_settings');
        await loadStateFromDB();
        showToast('Database wiped successfully', 'warning');
        renderCurrentView();
      }
    }

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }
